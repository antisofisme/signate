<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Viewer Test - Diagnostics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: #0f0;
            font-family: 'Courier New', monospace;
            padding: 20px;
            font-size: 14px;
        }

        .header {
            background: #000;
            border: 2px solid #0f0;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .header h1 {
            color: #0ff;
            margin-bottom: 10px;
        }

        .section {
            background: #000;
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .section h2 {
            color: #0ff;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .log {
            background: #000;
            border-left: 3px solid #0f0;
            padding: 8px 12px;
            margin: 5px 0;
            font-size: 12px;
        }

        .log.info { border-left-color: #0ff; color: #0ff; }
        .log.success { border-left-color: #0f0; color: #0f0; }
        .log.error { border-left-color: #f00; color: #f00; }
        .log.warning { border-left-color: #ff0; color: #ff0; }

        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border-radius: 3px;
        }

        button:hover {
            background: #0ff;
        }

        button:disabled {
            background: #666;
            color: #333;
            cursor: not-allowed;
        }

        .content-preview {
            margin-top: 15px;
            text-align: center;
        }

        .content-preview img,
        .content-preview video {
            max-width: 100%;
            max-height: 400px;
            border: 2px solid #0f0;
            border-radius: 5px;
        }

        input {
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 8px;
            font-family: 'Courier New', monospace;
            width: 200px;
            margin-right: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .stat {
            background: #222;
            padding: 10px;
            border-radius: 3px;
            border-left: 3px solid #0f0;
        }

        .stat-label {
            color: #888;
            font-size: 11px;
        }

        .stat-value {
            color: #0f0;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔧 Monitor Viewer - Diagnostic Tool</h1>
        <p>Test dan debug monitor viewer functionality</p>
    </div>

    <div class="section">
        <h2>⚙️ Configuration</h2>
        <div>
            <label>API URL: </label>
            <input type="text" id="apiUrl" value="http://192.168.5.12:8001">
            <button onclick="updateApiUrl()">Update</button>
        </div>
        <div style="margin-top: 10px;">
            <label>Device ID: </label>
            <input type="number" id="deviceId" value="1" min="1">
            <button onclick="registerMonitor()">Register New Monitor</button>
        </div>
    </div>

    <div class="section">
        <h2>🧪 Tests</h2>
        <button onclick="runAllTests()">▶ Run All Tests</button>
        <button onclick="testBackendConnection()">Test Backend</button>
        <button onclick="testPlaylistAPI()">Test Playlist API</button>
        <button onclick="testContentDisplay()">Test Content Display</button>
        <button onclick="clearLogs()">Clear Logs</button>
    </div>

    <div class="section">
        <h2>📊 Statistics</h2>
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Backend Status</div>
                <div class="stat-value" id="backendStatus">-</div>
            </div>
            <div class="stat">
                <div class="stat-label">Playlist Items</div>
                <div class="stat-value" id="playlistCount">-</div>
            </div>
            <div class="stat">
                <div class="stat-label">Content Type</div>
                <div class="stat-value" id="contentType">-</div>
            </div>
            <div class="stat">
                <div class="stat-label">Content URL</div>
                <div class="stat-value" id="contentUrl" style="font-size: 12px; word-break: break-all;">-</div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>📝 Logs</h2>
        <div id="logs"></div>
    </div>

    <div class="section">
        <h2>🖼️ Content Preview</h2>
        <div id="contentPreview" class="content-preview"></div>
    </div>

    <script>
        let API_BASE_URL = 'http://192.168.5.12:8001';
        let currentPlaylist = null;

        function updateApiUrl() {
            API_BASE_URL = document.getElementById('apiUrl').value;
            log('info', `API URL updated to: ${API_BASE_URL}`);
        }

        function log(type, message) {
            const logsDiv = document.getElementById('logs');
            const time = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log ${type}`;
            logEntry.innerHTML = `[${time}] ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
            log('info', 'Logs cleared');
        }

        function updateStat(id, value) {
            const elem = document.getElementById(id);
            if (elem) elem.textContent = value;
        }

        async function testBackendConnection() {
            log('info', '🔌 Testing backend connection...');
            try {
                const response = await fetch(`${API_BASE_URL}/health`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                log('success', `✅ Backend is healthy!`);
                log('info', `   - Environment: ${data.environment}`);
                log('info', `   - Database: ${data.database}`);
                log('info', `   - Redis: ${data.redis}`);

                updateStat('backendStatus', '✅ Healthy');
                return true;
            } catch (error) {
                log('error', `❌ Backend connection failed: ${error.message}`);
                updateStat('backendStatus', '❌ Failed');
                return false;
            }
        }

        async function testPlaylistAPI() {
            log('info', '📋 Testing playlist API...');
            const deviceId = document.getElementById('deviceId').value;

            try {
                log('info', `Fetching playlist for device ID: ${deviceId}`);
                const response = await fetch(`${API_BASE_URL}/api/client/playlist?device_id=${deviceId}`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                currentPlaylist = data;

                log('success', `✅ Playlist loaded successfully!`);
                log('info', `   - Device: ${data.device_name || 'Unknown'}`);
                log('info', `   - Total items: ${data.total_items || 0}`);
                log('info', `   - Playlist length: ${data.playlist?.length || 0}`);

                updateStat('playlistCount', data.total_items || 0);

                if (data.playlist && data.playlist.length > 0) {
                    log('info', '📦 Playlist contents:');
                    data.playlist.forEach((item, index) => {
                        log('info', `   ${index + 1}. ${item.title} (${item.content_type}) - ${item.duration}s`);
                    });
                } else {
                    log('warning', '⚠️ Playlist is empty!');
                }

                return true;
            } catch (error) {
                log('error', `❌ Playlist API failed: ${error.message}`);
                updateStat('playlistCount', 'Error');
                return false;
            }
        }

        async function testContentDisplay() {
            log('info', '🖼️ Testing content display...');

            if (!currentPlaylist || !currentPlaylist.playlist || currentPlaylist.playlist.length === 0) {
                log('error', '❌ No playlist loaded. Run "Test Playlist API" first.');
                return false;
            }

            const content = currentPlaylist.playlist[0];
            const previewDiv = document.getElementById('contentPreview');

            try {
                log('info', `Loading content: ${content.title}`);
                log('info', `   - Type: ${content.content_type}`);
                log('info', `   - URL: ${content.url}`);
                log('info', `   - Duration: ${content.duration}s`);

                updateStat('contentType', content.content_type);
                updateStat('contentUrl', content.url);

                previewDiv.innerHTML = '';

                if (content.content_type === 'video') {
                    log('info', 'Creating video element...');
                    const video = document.createElement('video');
                    video.src = content.url;
                    video.autoplay = true;
                    video.muted = true;
                    video.loop = true;
                    video.controls = true;

                    video.onloadeddata = () => {
                        log('success', '✅ Video loaded successfully!');
                    };

                    video.onerror = (e) => {
                        log('error', `❌ Video load error: ${e.message || 'Unknown error'}`);
                    };

                    previewDiv.appendChild(video);
                } else {
                    log('info', 'Creating image element...');
                    const img = document.createElement('img');
                    img.src = content.url;

                    img.onload = () => {
                        log('success', '✅ Image loaded successfully!');
                        log('info', `   - Size: ${img.naturalWidth}x${img.naturalHeight}px`);
                    };

                    img.onerror = (e) => {
                        log('error', `❌ Image load error: Failed to load from ${content.url}`);
                        log('error', `   Check if the content proxy endpoint is working`);
                    };

                    previewDiv.appendChild(img);
                }

                return true;
            } catch (error) {
                log('error', `❌ Content display failed: ${error.message}`);
                return false;
            }
        }

        async function registerMonitor() {
            log('info', '📝 Registering new monitor...');

            try {
                const code = Math.floor(100000 + Math.random() * 900000).toString();

                const response = await fetch(`${API_BASE_URL}/api/devices/monitor/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        activation_code: code,
                        device_name: `TestMonitor-${code}`
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                document.getElementById('deviceId').value = data.id;

                log('success', `✅ Monitor registered!`);
                log('info', `   - Device ID: ${data.id}`);
                log('info', `   - Activation Code: ${code}`);
                log('info', `   - Status: ${data.status}`);
                log('warning', `⚠️ Go to Web Admin to activate this monitor`);

                return true;
            } catch (error) {
                log('error', `❌ Registration failed: ${error.message}`);
                return false;
            }
        }

        async function runAllTests() {
            clearLogs();
            log('info', '🚀 Running all tests...');
            log('info', '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');

            const backendOk = await testBackendConnection();
            log('info', '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');

            if (!backendOk) {
                log('error', '❌ Backend test failed. Fix backend connection first.');
                return;
            }

            const playlistOk = await testPlaylistAPI();
            log('info', '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');

            if (!playlistOk) {
                log('error', '❌ Playlist test failed. Check device ID and assignments.');
                return;
            }

            await testContentDisplay();
            log('info', '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            log('success', '✅ All tests completed!');
        }

        // Auto-run tests on load
        window.onload = () => {
            log('info', '👋 Monitor Viewer Test Tool Ready');
            log('info', 'Click "Run All Tests" to start diagnostics');
        };
    </script>
</body>
</html>
