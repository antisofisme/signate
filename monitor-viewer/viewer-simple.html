<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Viewer - Simple Direct Replacement</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #fullscreen-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
        }

        #fullscreen-container img,
        #fullscreen-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
        }

        #debug-panel {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border: 1px solid #0f0;
            border-radius: 5px;
            z-index: 10000;
            max-width: 300px;
        }

        #debug-panel.hidden {
            display: none;
        }

        .config-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            color: #0f0;
            padding: 30px;
            border: 2px solid #0f0;
            border-radius: 10px;
            z-index: 10001;
            font-family: 'Courier New', monospace;
        }

        .config-panel h1 {
            color: #0ff;
            margin-bottom: 20px;
        }

        .config-panel input {
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 10px;
            margin: 10px 0;
            width: 300px;
            font-family: 'Courier New', monospace;
        }

        .config-panel button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 12px 30px;
            margin-top: 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border-radius: 5px;
        }

        .config-panel button:hover {
            background: #0ff;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f0;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            z-index: 10002;
        }
    </style>
</head>
<body>
    <!-- Configuration Panel (shown on first load) -->
    <div id="config-panel" class="config-panel" style="display: none;">
        <h1>🖥️ Monitor Viewer Setup</h1>
        <div>
            <label>Device ID:</label><br>
            <input type="number" id="device-id-input" value="1" min="1">
        </div>
        <div>
            <label>Backend URL:</label><br>
            <input type="text" id="backend-url-input" value="http://192.168.5.12:8001">
        </div>
        <button onclick="startViewer()">Start Viewer</button>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="loading" style="display: none;">Loading...</div>

    <!-- Fullscreen Content Container -->
    <div id="fullscreen-container"></div>

    <!-- Debug Panel -->
    <div id="debug-panel">
        <div>Device ID: <span id="debug-device-id">-</span></div>
        <div>Playlist: <span id="debug-playlist-count">-</span> items</div>
        <div>Current: <span id="debug-current-index">-</span></div>
        <div>Next change: <span id="debug-next-change">-</span></div>
        <div>Status: <span id="debug-status">Waiting...</span></div>
    </div>

    <script>
        // Configuration
        let API_BASE_URL = 'http://192.168.5.12:8001';
        let DEVICE_ID = null;
        let REFRESH_INTERVAL = 10000; // 10 seconds

        // State
        let playlist = [];
        let currentIndex = 0;
        let contentTimer = null;
        let refreshTimer = null;

        // Load saved config
        function loadConfig() {
            const savedDeviceId = localStorage.getItem('deviceId');
            const savedBackendUrl = localStorage.getItem('backendUrl');

            if (savedDeviceId && savedBackendUrl) {
                DEVICE_ID = parseInt(savedDeviceId);
                API_BASE_URL = savedBackendUrl;
                document.getElementById('device-id-input').value = DEVICE_ID;
                document.getElementById('backend-url-input').value = API_BASE_URL;
                return true;
            }
            return false;
        }

        // Start viewer
        function startViewer() {
            DEVICE_ID = parseInt(document.getElementById('device-id-input').value);
            API_BASE_URL = document.getElementById('backend-url-input').value;

            // Save config
            localStorage.setItem('deviceId', DEVICE_ID);
            localStorage.setItem('backendUrl', API_BASE_URL);

            // Hide config panel
            document.getElementById('config-panel').style.display = 'none';

            // Update debug
            document.getElementById('debug-device-id').textContent = DEVICE_ID;

            // Start
            console.log('Starting viewer with Device ID:', DEVICE_ID);
            init();
        }

        // Initialize
        async function init() {
            console.log('🚀 Initializing Monitor Viewer');
            updateStatus('Initializing...');

            // Load playlist
            await loadPlaylist();

            // Start auto-refresh
            startAutoRefresh();

            // Start playing
            if (playlist.length > 0) {
                playContent(0);
            } else {
                updateStatus('No content in playlist');
            }
        }

        // Load playlist from backend
        async function loadPlaylist(forceRestart = false) {
            try {
                const isFirstLoad = playlist.length === 0;

                if (!isFirstLoad) {
                    console.log('🔄 Auto-refresh: checking for playlist updates...');
                } else {
                    console.log('📋 First load: loading playlist from:', `${API_BASE_URL}/api/client/playlist?device_id=${DEVICE_ID}`);
                    updateStatus('Loading playlist...');
                }

                const response = await fetch(`${API_BASE_URL}/api/client/playlist?device_id=${DEVICE_ID}`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                if (isFirstLoad) {
                    console.log('Playlist loaded:', data);
                    console.log('Total items in playlist:', data.total_items);
                }

                // Check if playlist actually changed
                const oldPlaylistJSON = JSON.stringify(playlist);
                const newPlaylistJSON = JSON.stringify(data.playlist || []);

                if (oldPlaylistJSON !== newPlaylistJSON || forceRestart) {
                    if (isFirstLoad) {
                        console.log('✅ First playlist load');
                    } else {
                        console.log('✨ Playlist changed! Restarting playback...');
                        console.log('Old playlist:', playlist.length, 'items');
                        console.log('New playlist:', (data.playlist || []).length, 'items');
                    }

                    playlist = data.playlist || [];
                    document.getElementById('debug-playlist-count').textContent = playlist.length;

                    // Clear existing timer and restart playback
                    if (contentTimer) {
                        console.log('Clearing existing content timer');
                        clearTimeout(contentTimer);
                        contentTimer = null;
                    }

                    // Start playback
                    if (playlist.length > 0) {
                        currentIndex = 0;
                        console.log('Starting playback from index 0');
                        playContent(0);
                    } else {
                        console.log('⚠️ Playlist is empty');
                        updateStatus('Playlist empty');
                    }
                } else {
                    // Playlist unchanged - DO NOT interrupt playback
                    console.log('✅ Playlist unchanged - continuing playback normally');
                }

                if (isFirstLoad || oldPlaylistJSON !== newPlaylistJSON) {
                    updateStatus('Running');
                }

                return true;

            } catch (error) {
                console.error('❌ Failed to load playlist:', error);
                updateStatus('Error: ' + error.message);
                return false;
            }
        }

        // Play content at index
        function playContent(index) {
            // Wrap around
            if (index >= playlist.length) {
                console.log(`Index ${index} >= playlist length ${playlist.length}, wrapping to 0`);
                index = 0;
            }

            if (playlist.length === 0) {
                console.log('⚠️ No content to play - playlist is empty');
                return;
            }

            const content = playlist[index];
            currentIndex = index;

            console.log(`▶️ Playing content ${index + 1}/${playlist.length}:`, content.title);
            console.log(`   - Type: ${content.content_type}`);
            console.log(`   - Duration: ${content.duration} seconds`);
            console.log(`   - URL: ${content.url}`);

            // Update debug
            document.getElementById('debug-current-index').textContent = `${index + 1}/${playlist.length}`;
            updateStatus('Playing: ' + content.title);

            // Clear any existing timer
            if (contentTimer) {
                console.log('Clearing previous content timer');
                clearTimeout(contentTimer);
                contentTimer = null;
            }

            // Show content using direct replacement pattern (like old viewer)
            showContent(content);

            // Schedule next content
            const duration = content.duration * 1000; // Convert to milliseconds
            const nextChangeTime = new Date(Date.now() + duration);
            document.getElementById('debug-next-change').textContent = nextChangeTime.toLocaleTimeString();

            console.log(`⏰ Next content will play in ${content.duration} seconds at ${nextChangeTime.toLocaleTimeString()}`);

            contentTimer = setTimeout(() => {
                console.log(`⏱️ Timer triggered! Moving to next content (index ${index + 1})`);
                playContent(index + 1);
            }, duration);

            console.log(`✅ Content timer set for ${duration}ms (timer ID: ${contentTimer})`);
        }

        // Show content (DIRECT REPLACEMENT - no crossfade)
        function showContent(content) {
            const container = document.getElementById('fullscreen-container');

            // KEY PATTERN FROM OLD VIEWER: Clear everything first!
            console.log('🗑️ Clearing container (direct replacement pattern)');
            container.innerHTML = '';

            console.log(`📦 Loading ${content.content_type}:`, content.url);

            if (content.content_type === 'video') {
                // Create video element
                console.log('🎬 Creating video element');
                const video = document.createElement('video');
                video.src = content.url;
                video.autoplay = true;
                video.muted = true;
                video.loop = false;
                video.style.width = '100%';
                video.style.height = '100%';
                video.style.objectFit = 'contain';

                video.onloadeddata = () => {
                    console.log('✅ Video loaded and ready to play');
                };

                video.onplay = () => {
                    console.log('▶️ Video started playing');
                };

                video.onerror = (e) => {
                    console.error('❌ Video load error:', e);
                    console.error('Video element:', video);
                    updateStatus('Error loading video');
                };

                // Add to container
                container.appendChild(video);
                console.log('Video element added to container');

            } else {
                // Create image element
                console.log('🖼️ Creating image element');
                const img = document.createElement('img');
                img.src = content.url;
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'contain';

                img.onload = () => {
                    console.log('✅ Image loaded successfully');
                    console.log(`   - Size: ${img.naturalWidth}x${img.naturalHeight}px`);
                };

                img.onerror = (e) => {
                    console.error('❌ Image load error:', e);
                    console.error('Image element:', img);
                    updateStatus('Error loading image');
                };

                // Add to container
                container.appendChild(img);
                console.log('Image element added to container');
            }
        }

        // Start auto-refresh
        function startAutoRefresh() {
            console.log('📡 Starting auto-refresh (every', REFRESH_INTERVAL / 1000, 'seconds)');

            refreshTimer = setInterval(() => {
                console.log('🔄 Auto-refresh triggered');
                loadPlaylist();
            }, REFRESH_INTERVAL);
        }

        // Update status in debug panel
        function updateStatus(status) {
            document.getElementById('debug-status').textContent = status;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // D key to toggle debug panel
            if (e.key === 'd' || e.key === 'D') {
                const panel = document.getElementById('debug-panel');
                panel.classList.toggle('hidden');
            }

            // R key to reload playlist
            if (e.key === 'r' || e.key === 'R') {
                console.log('🔄 Manual refresh triggered');
                loadPlaylist();
            }

            // C key to show config
            if (e.key === 'c' || e.key === 'C') {
                document.getElementById('config-panel').style.display = 'block';
            }
        });

        // Auto-start on load
        window.onload = () => {
            console.log('👋 Monitor Viewer - Simple Direct Replacement');
            console.log('Based on old viewer pattern: container.innerHTML = ""');

            if (loadConfig()) {
                // Config exists, auto-start
                console.log('Auto-starting with saved config');
                startViewer();
            } else {
                // Show config panel
                document.getElementById('config-panel').style.display = 'block';
            }

            console.log('Keyboard shortcuts:');
            console.log('  D - Toggle debug panel');
            console.log('  R - Reload playlist');
            console.log('  C - Show config');
        };
    </script>
</body>
</html>
