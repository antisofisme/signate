<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Viewer - Debug Page</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #0f0;
            border-radius: 5px;
        }
        .error { color: #f00; }
        .success { color: #0f0; }
        .info { color: #0ff; }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover { background: #0ff; }
        pre {
            background: #000;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔧 Monitor Viewer - Debug Mode</h1>

    <div class="section">
        <h2>1. LocalStorage Check</h2>
        <div id="localStorage-status"></div>
        <button onclick="checkLocalStorage()">Check LocalStorage</button>
        <button onclick="clearLocalStorage()">Clear LocalStorage</button>
    </div>

    <div class="section">
        <h2>2. API Connection Test</h2>
        <div id="api-status"></div>
        <button onclick="testAPIConnection()">Test API</button>
    </div>

    <div class="section">
        <h2>3. Playlist Test</h2>
        <div id="playlist-status"></div>
        <button onclick="testPlaylist()">Test Playlist</button>
    </div>

    <div class="section">
        <h2>4. Content URL Test</h2>
        <div id="content-status"></div>
        <button onclick="testContentURL()">Test Content URL</button>
    </div>

    <div class="section">
        <h2>Actions</h2>
        <button onclick="registerNewMonitor()">Register New Monitor</button>
        <button onclick="window.location.href='index.html'">Go to Monitor Viewer</button>
    </div>

    <script>
        const API_BASE_URL = 'http://192.168.5.12:8001';

        function log(elementId, message, type = 'info') {
            const el = document.getElementById(elementId);
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            el.innerHTML += `<div class="${className}">${message}</div>`;
        }

        function checkLocalStorage() {
            const statusEl = document.getElementById('localStorage-status');
            statusEl.innerHTML = '';

            const deviceId = localStorage.getItem('monitor_device_id');
            const code = localStorage.getItem('monitor_activation_code');
            const status = localStorage.getItem('monitor_status');

            log('localStorage-status', `Device ID: ${deviceId || 'NOT SET'}`, deviceId ? 'success' : 'error');
            log('localStorage-status', `Activation Code: ${code || 'NOT SET'}`, code ? 'success' : 'error');
            log('localStorage-status', `Status: ${status || 'NOT SET'}`, status === 'active' ? 'success' : 'info');
        }

        function clearLocalStorage() {
            localStorage.clear();
            log('localStorage-status', 'LocalStorage cleared!', 'success');
            checkLocalStorage();
        }

        async function testAPIConnection() {
            const statusEl = document.getElementById('api-status');
            statusEl.innerHTML = '';

            try {
                log('api-status', 'Testing API connection...', 'info');
                const response = await fetch(`${API_BASE_URL}/health`);
                const data = await response.json();

                log('api-status', `API Status: ${data.status}`, 'success');
                log('api-status', `Database: ${data.database}`, 'success');
                log('api-status', `Redis: ${data.redis}`, 'success');
            } catch (error) {
                log('api-status', `ERROR: ${error.message}`, 'error');
            }
        }

        async function testPlaylist() {
            const statusEl = document.getElementById('playlist-status');
            statusEl.innerHTML = '';

            const deviceId = localStorage.getItem('monitor_device_id');
            if (!deviceId) {
                log('playlist-status', 'ERROR: No device ID in localStorage', 'error');
                log('playlist-status', 'Please register a monitor first', 'error');
                return;
            }

            try {
                log('playlist-status', `Testing playlist for device ${deviceId}...`, 'info');
                const response = await fetch(`${API_BASE_URL}/api/client/playlist?device_id=${deviceId}`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                log('playlist-status', `Device: ${data.device_name}`, 'success');
                log('playlist-status', `Total Items: ${data.total_items}`, 'success');

                if (data.playlist && data.playlist.length > 0) {
                    log('playlist-status', `Playlist Content:`, 'success');
                    statusEl.innerHTML += '<pre>' + JSON.stringify(data.playlist, null, 2) + '</pre>';
                } else {
                    log('playlist-status', 'WARNING: Playlist is empty!', 'error');
                }
            } catch (error) {
                log('playlist-status', `ERROR: ${error.message}`, 'error');
            }
        }

        async function testContentURL() {
            const statusEl = document.getElementById('content-status');
            statusEl.innerHTML = '';

            const deviceId = localStorage.getItem('monitor_device_id');
            if (!deviceId) {
                log('content-status', 'ERROR: No device ID', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/client/playlist?device_id=${deviceId}`);
                const data = await response.json();

                if (data.playlist && data.playlist.length > 0) {
                    const content = data.playlist[0];
                    log('content-status', `Testing URL: ${content.url}`, 'info');

                    const urlTest = await fetch(content.url, { method: 'HEAD' });
                    log('content-status', `URL Status: ${urlTest.status}`, urlTest.ok ? 'success' : 'error');
                    log('content-status', `Content-Type: ${urlTest.headers.get('Content-Type')}`, 'success');
                } else {
                    log('content-status', 'No content in playlist', 'error');
                }
            } catch (error) {
                log('content-status', `ERROR: ${error.message}`, 'error');
            }
        }

        async function registerNewMonitor() {
            const statusEl = document.getElementById('localStorage-status');

            try {
                const code = Math.floor(100000 + Math.random() * 900000).toString();

                log('localStorage-status', `Registering with code: ${code}`, 'info');

                const response = await fetch(`${API_BASE_URL}/api/devices/monitor/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        activation_code: code,
                        device_name: `Monitor-${code}`
                    })
                });

                const data = await response.json();

                localStorage.setItem('monitor_device_id', data.id);
                localStorage.setItem('monitor_activation_code', code);
                localStorage.setItem('monitor_status', 'pending');

                log('localStorage-status', `Registered! Device ID: ${data.id}`, 'success');
                log('localStorage-status', `Activation Code: ${code}`, 'success');
                log('localStorage-status', `Go to Web Admin to activate this device`, 'info');

                checkLocalStorage();
            } catch (error) {
                log('localStorage-status', `ERROR: ${error.message}`, 'error');
            }
        }

        // Auto-run on load
        window.onload = () => {
            checkLocalStorage();
        };
    </script>
</body>
</html>
