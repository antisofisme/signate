<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Player Test</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #player-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #222;
    }

    #video-element {
      width: 100%;
      height: 100%;
      background: #000;
    }

    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.8);
      padding: 20px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    button {
      padding: 10px 20px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #0055aa;
    }

    #status {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="player-container">
    <video id="video-element"></video>
  </div>

  <div class="controls">
    <button onclick="playClockWidget()">Play Clock Widget</button>
    <button onclick="playWeatherWidget()">Play Weather Widget</button>
    <button onclick="playTextWidget()">Play Text Widget</button>
    <button onclick="playCalendarWidget()">Play Calendar Widget</button>
    <button onclick="playMultipleWidgets()">Play Multiple Widgets</button>
    <button onclick="stopPlayback()">Stop</button>
  </div>

  <div id="status">Ready</div>

  <script type="module">
    import { PlayerHLS } from './src/player/services/player-hls.js';
    
    window.playerHLS = PlayerHLS;

    function updateStatus(text) {
      document.getElementById('status').textContent = text;
    }

    // Initialize player
    PlayerHLS.initialize(document.getElementById('video-element'));
    updateStatus('Player initialized');

    // Test widget content
    const createWidgetContent = (widgetData, duration = 30) => ({
      id: Date.now(),
      title: 'Widget Test',
      type: 'widget',
      url: '',
      duration: duration,
      widget_data: widgetData
    });

    // Clock widget test
    window.playClockWidget = async () => {
      const clockWidget = {
        id: 'clock-1',
        type: 'clock',
        name: 'Digital Clock',
        position: { x: 50, y: 50, width: 300, height: 100 },
        is_visible: true,
        animation: { type: 'fade', duration: 500 },
        config: {
          format: '24h',
          show_seconds: true,
          style: 'digital',
          font_size: 48,
          color: '#ffffff'
        }
      };

      const playlist = {
        id: 1,
        name: 'Clock Widget Test',
        items: [{
          content: createWidgetContent(clockWidget),
          duration: 30
        }]
      };

      await PlayerHLS.loadPlaylist(playlist);
      updateStatus('Playing clock widget');
    };

    // Weather widget test
    window.playWeatherWidget = async () => {
      const weatherWidget = {
        id: 'weather-1',
        type: 'weather',
        name: 'Weather Display',
        position: { x: 50, y: 200, width: 400, height: 300 },
        is_visible: true,
        config: {
          location: 'Jakarta, Indonesia',
          units: 'metric',
          show_forecast: true,
          forecast_days: 3,
          update_interval: 30,
          style: 'detailed'
        }
      };

      const playlist = {
        id: 2,
        name: 'Weather Widget Test',
        items: [{
          content: createWidgetContent(weatherWidget, 45),
          duration: 45
        }]
      };

      await PlayerHLS.loadPlaylist(playlist);
      updateStatus('Playing weather widget');
    };

    // Text widget test
    window.playTextWidget = async () => {
      const textWidget = {
        id: 'text-1',
        type: 'text',
        name: 'Scrolling Text',
        position: { x: 0, y: 600, width: 1920, height: 100 },
        is_visible: true,
        config: {
          content: 'Welcome to Smart TV Digital Signage System - Current time: {{current_time}} - Today is {{day_of_week}}',
          font_size: 32,
          color: '#ffff00',
          background_color: 'rgba(0,0,0,0.7)',
          text_align: 'center',
          scroll: {
            enabled: true,
            direction: 'left',
            speed: 100
          },
          template_variables: true
        }
      };

      const playlist = {
        id: 3,
        name: 'Text Widget Test',
        items: [{
          content: createWidgetContent(textWidget),
          duration: 30
        }]
      };

      await PlayerHLS.loadPlaylist(playlist);
      updateStatus('Playing text widget');
    };

    // Calendar widget test
    window.playCalendarWidget = async () => {
      const calendarWidget = {
        id: 'calendar-1',
        type: 'calendar',
        name: 'Monthly Calendar',
        position: { x: 500, y: 100, width: 600, height: 500 },
        is_visible: true,
        config: {
          view: 'month',
          show_events: true,
          theme: 'dark',
          highlight_today: true,
          show_week_numbers: true
        }
      };

      const playlist = {
        id: 4,
        name: 'Calendar Widget Test',
        items: [{
          content: createWidgetContent(calendarWidget, 40),
          duration: 40
        }]
      };

      await PlayerHLS.loadPlaylist(playlist);
      updateStatus('Playing calendar widget');
    };

    // Multiple widgets test
    window.playMultipleWidgets = async () => {
      const widgets = [
        {
          id: 'clock-top',
          type: 'clock',
          name: 'Top Clock',
          position: { x: 20, y: 20, width: 250, height: 80 },
          is_visible: true,
          config: {
            format: '24h',
            show_seconds: true,
            style: 'digital',
            font_size: 36,
            color: '#00ff00'
          }
        },
        {
          id: 'weather-corner',
          type: 'weather',
          name: 'Corner Weather',
          position: { x: 1520, y: 20, width: 380, height: 200 },
          is_visible: true,
          config: {
            location: 'Bali, Indonesia',
            units: 'metric',
            style: 'minimal',
            update_interval: 60
          }
        },
        {
          id: 'bottom-text',
          type: 'text',
          name: 'Bottom Banner',
          position: { x: 0, y: 980, width: 1920, height: 100 },
          is_visible: true,
          config: {
            content: 'Breaking News: Smart TV Digital Signage System now supports advanced widgets! • Temperature: 28°C • Humidity: 75%',
            font_size: 28,
            color: '#ffffff',
            background_color: '#cc0000',
            text_align: 'left',
            scroll: {
              enabled: true,
              direction: 'left',
              speed: 80
            }
          }
        },
        {
          id: 'calendar-center',
          type: 'calendar',
          name: 'Center Calendar',
          position: { x: 660, y: 240, width: 600, height: 600 },
          is_visible: true,
          config: {
            view: 'month',
            theme: 'light',
            highlight_today: true
          }
        }
      ];

      const playlist = {
        id: 5,
        name: 'Multiple Widgets Test',
        items: [{
          content: createWidgetContent(widgets, 60),
          duration: 60
        }]
      };

      await PlayerHLS.loadPlaylist(playlist);
      updateStatus('Playing multiple widgets');
    };

    // Stop playback
    window.stopPlayback = () => {
      PlayerHLS.stop();
      updateStatus('Playback stopped');
    };
  </script>
</body>
</html>
