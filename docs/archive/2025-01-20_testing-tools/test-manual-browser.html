<!DOCTYPE html>
<html>
<head>
    <title>Manual Browser Test - Connection Log Popup</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-section {
            background: #2a2a2a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .warning { color: #fbbf24; }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #2563eb;
        }
        #results {
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>🔍 Manual Browser Test - Connection Log Popup</h1>

    <div class="test-section">
        <h2>Instructions:</h2>
        <ol>
            <li>Click "Run Test" button below</li>
            <li>Test akan membuka player di iframe</li>
            <li>Test akan memeriksa apakah ConnectionLogPopup ter-load</li>
            <li>Test akan men-simulate click pada icon network status</li>
        </ol>
    </div>

    <button onclick="runTest()">Run Test</button>
    <button onclick="clearResults()">Clear Results</button>

    <div id="results"></div>

    <iframe id="player" src="http://192.168.5.12:8080/" style="width:100%; height:600px; border:1px solid #444; margin-top:20px;"></iframe>

    <script>
        let log = '';

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'success' ? 'success' : type === 'error' ? 'error' : type === 'warning' ? 'warning' : '';
            log += `[${timestamp}] ${message}\n`;
            document.getElementById('results').innerHTML = `<div class="${color}">${log}</div>`;
        }

        function clearResults() {
            log = '';
            document.getElementById('results').innerHTML = '';
        }

        async function runTest() {
            clearResults();
            addLog('🚀 Starting manual browser test...', 'info');

            const iframe = document.getElementById('player');

            // Wait for iframe to load
            await new Promise((resolve) => {
                if (iframe.contentWindow.document.readyState === 'complete') {
                    resolve();
                } else {
                    iframe.onload = resolve;
                }
            });

            addLog('✅ Player loaded in iframe', 'success');

            // Wait a bit for JavaScript to initialize
            await new Promise(resolve => setTimeout(resolve, 5000));
            addLog('⏳ Waited 5 seconds for initialization', 'info');

            try {
                const iframeWindow = iframe.contentWindow;
                const iframeDoc = iframe.contentDocument;

                // Check window objects
                addLog('\n📋 Checking window objects:', 'info');
                addLog('  - window.ConnectionLogPopup: ' + (typeof iframeWindow.ConnectionLogPopup !== 'undefined' ? '✅ FOUND' : '❌ NOT FOUND'),
                       typeof iframeWindow.ConnectionLogPopup !== 'undefined' ? 'success' : 'error');
                addLog('  - window.ConnectionLogger: ' + (typeof iframeWindow.ConnectionLogger !== 'undefined' ? '✅ FOUND' : '❌ NOT FOUND'),
                       typeof iframeWindow.ConnectionLogger !== 'undefined' ? 'success' : 'error');
                addLog('  - window.NetworkSpeedTest: ' + (typeof iframeWindow.NetworkSpeedTest !== 'undefined' ? '✅ FOUND' : '❌ NOT FOUND'),
                       typeof iframeWindow.NetworkSpeedTest !== 'undefined' ? 'success' : 'error');

                // Check DOM elements
                addLog('\n📋 Checking DOM elements:', 'info');
                const networkIcon = iframeDoc.getElementById('network-status');
                const serverIcon = iframeDoc.getElementById('server-status');
                const popup = iframeDoc.getElementById('connection-log-popup');

                addLog('  - #network-status: ' + (networkIcon ? '✅ FOUND' : '❌ NOT FOUND'),
                       networkIcon ? 'success' : 'error');
                addLog('  - #server-status: ' + (serverIcon ? '✅ FOUND' : '❌ NOT FOUND'),
                       serverIcon ? 'success' : 'error');
                addLog('  - #connection-log-popup: ' + (popup ? '✅ FOUND' : '❌ NOT FOUND'),
                       popup ? 'success' : 'warning');

                if (networkIcon) {
                    const style = iframeWindow.getComputedStyle(networkIcon);
                    addLog('  - Network icon cursor: ' + style.cursor,
                           style.cursor === 'pointer' ? 'success' : 'warning');
                }

                // Try to click if possible
                if (networkIcon && iframeWindow.ConnectionLogPopup) {
                    addLog('\n👆 Attempting to click network icon...', 'info');
                    networkIcon.click();

                    await new Promise(resolve => setTimeout(resolve, 1000));

                    const popupAfterClick = iframeDoc.getElementById('connection-log-popup');
                    const isVisible = popupAfterClick && popupAfterClick.style.display !== 'none';

                    addLog('  - Popup visible after click: ' + (isVisible ? '✅ YES' : '❌ NO'),
                           isVisible ? 'success' : 'error');

                    if (isVisible) {
                        addLog('\n🎉 SUCCESS! Connection log popup is working!', 'success');
                    } else {
                        addLog('\n❌ FAILED! Popup did not appear after click', 'error');
                    }
                } else {
                    addLog('\n⚠️ Cannot test click - missing networkIcon or ConnectionLogPopup', 'warning');
                }

            } catch (error) {
                addLog('\n❌ Error during test: ' + error.message, 'error');
                console.error(error);
            }
        }
    </script>
</body>
</html>
