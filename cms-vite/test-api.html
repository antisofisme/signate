<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Connection Test</h1>
    <div id="result"></div>
    <script>
        // Test API connection
        fetch('/api/v1/widgets')
            .then(res => {
                document.getElementById('result').innerHTML = 
                    `<p>API Response Status: ${res.status}</p>
                     <p>API URL: ${res.url}</p>
                     <p style="color: ${res.ok ? 'green' : 'orange'}">
                        ${res.ok ? 'API proxy working!' : 'API requires authentication (expected)'}
                     </p>`;
                return res.json();
            })
            .then(data => {
                document.getElementById('result').innerHTML += 
                    `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            })
            .catch(err => {
                document.getElementById('result').innerHTML = 
                    `<p style="color: red">Error: ${err}</p>`;
            });
    </script>
</body>
</html>
