[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "puguh-sdk"
version = "1.0.0"
description = "Python SDK for PUGUH Platform - Authentication, Multi-tenancy, and Billing infrastructure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "ATLAS Team", email = "dev@atlas.io" }
]
keywords = [
    "puguh",
    "saas",
    "authentication",
    "multi-tenant",
    "billing",
    "infrastructure",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "respx>=0.20.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/arsaka-puguh/sdk-python"
Documentation = "https://docs.puguh.io/sdk/python"
Repository = "https://github.com/arsaka-puguh/sdk-python"
Issues = "https://github.com/arsaka-puguh/sdk-python/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/puguh_sdk",
]

[tool.hatch.build.targets.wheel]
packages = ["puguh_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
