server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # ============================================================================
    # SECURITY HEADERS - Enterprise Security Standards
    # ============================================================================

    # Content Security Policy - Prevents XSS, code injection
    # Adjust connect-src for your API domain in production
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.atlashub.com https://api.atlashub.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none';" always;

    # X-Frame-Options - Prevents clickjacking
    add_header X-Frame-Options "DENY" always;

    # X-Content-Type-Options - Prevents MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # X-XSS-Protection - Legacy XSS protection (still useful for older browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer-Policy - Controls referrer information
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy - Restricts browser features
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Strict-Transport-Security - Forces HTTPS (enable after confirming HTTPS works)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Cross-Origin-Opener-Policy - Isolates browsing context
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Cross-Origin-Resource-Policy - Controls resource loading
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ============================================================================
    # ROUTING
    # ============================================================================

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets with security
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-add security headers for static files
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ \.(env|git|gitignore|dockerignore)$ {
        deny all;
        return 404;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================================================
    # ERROR PAGES
    # ============================================================================

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
