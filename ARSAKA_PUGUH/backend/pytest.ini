[pytest]
# Pytest Configuration for Core Service Tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = core/tests

# Asyncio mode for async tests
asyncio_mode = auto

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --color=yes
    -ra
    --cov=core
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80

# Markers
markers =
    unit: Unit tests for domain and use case logic
    integration: Integration tests for full request-response flow
    slow: Slow-running tests

# Ignore paths
norecursedirs = .git __pycache__ dist build *.egg venv

# Warning filters
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
