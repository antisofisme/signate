version: '3.8'

# =============================================================================
# ATLAS_CHAT_AI Production Docker Compose
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - Copy .env.example to .env and fill in values
#   - Ensure OpenAI API key is set
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: atlas_chat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-chat}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-atlas_chat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/infrastructure/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chat} -d ${DB_NAME:-atlas_chat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - atlas_chat_internal

  # ===========================================================================
  # Qdrant Vector Database
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: atlas_chat_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - atlas_chat_internal

  # ===========================================================================
  # Redis Cache & Queue
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: atlas_chat_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - atlas_chat_internal

  # ===========================================================================
  # Chat API (Production)
  # ===========================================================================
  chat-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: atlas-chat-api:${VERSION:-latest}
    container_name: atlas_chat_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8003}:8003"
    environment:
      # App
      - ENVIRONMENT=production
      - DEBUG=false
      - APP_NAME=ATLAS_CHAT_AI
      - APP_VERSION=${VERSION:-1.0.0}

      # Database
      - DATABASE_URL=postgresql://${DB_USER:-chat}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-atlas_chat}

      # Vector Store
      - QDRANT_URL=http://qdrant:6333

      # Cache
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0

      # AI Providers
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}

      # Security
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}

      # Rate Limiting
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_CHAT=30
      - RATE_LIMIT_SEARCH=60
      - RATE_LIMIT_GENERAL=120

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=json
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - atlas_chat_internal
      - traefik_public
    labels:
      # Traefik labels for reverse proxy
      - "traefik.enable=true"
      - "traefik.http.routers.chat-api.rule=Host(`chat-api.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.chat-api.tls=true"
      - "traefik.http.routers.chat-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.chat-api.loadbalancer.server.port=8003"

  # ===========================================================================
  # Chat Admin Frontend
  # ===========================================================================
  chat-admin:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    image: atlas-chat-admin:${VERSION:-latest}
    container_name: atlas_chat_admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3003}:80"
    depends_on:
      - chat-api
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - atlas_chat_internal
      - traefik_public
    labels:
      # Traefik labels for reverse proxy
      - "traefik.enable=true"
      - "traefik.http.routers.chat-admin.rule=Host(`chat.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.chat-admin.tls=true"
      - "traefik.http.routers.chat-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.chat-admin.loadbalancer.server.port=80"

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  redis_data:
    driver: local

networks:
  atlas_chat_internal:
    name: atlas_chat_internal
    driver: bridge
  traefik_public:
    external: true
    name: traefik_public
