<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage Viewer - Shell</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
        }

        /* Activation Screen (shown until approved) */
        #activation-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1000;
        }

        .activation-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        #activation-code {
            font-size: 5rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            padding: 1.5rem 3rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            margin: 2rem 0;
            letter-spacing: 0.3rem;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #status-message {
            font-size: 1.5rem;
            margin: 1.5rem 0;
        }

        /* Player Container (hidden until activated) */
        #player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 100;
        }

        #player-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #error-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.2rem;
            display: none;
        }

        /* Shell Info (debug) */
        #shell-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 9999;
            display: none; /* Hide by default, show with keyboard shortcut */
        }

        /* Enter Fullscreen Button */
        #enter-fullscreen-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease, background 0.2s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            pointer-events: auto;
        }

        /* Button hover effect */
        #enter-fullscreen-btn:hover {
            background: rgba(0, 100, 255, 0.8);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        /* Show button class (triggered by JS) */
        #enter-fullscreen-btn.show {
            opacity: 1;
        }

        /* WiFi Status Icon (Top Right Corner) */
        #wifi-icon {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s ease;
            font-size: 20px;
        }

        #wifi-icon.online {
            color: #22c55e; /* green */
        }

        #wifi-icon.offline {
            color: #ef4444; /* red */
        }

        /* Exit Fullscreen Button */
        #exit-fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease, background 0.2s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            pointer-events: auto;
        }

        /* Button hover effect */
        #exit-fullscreen-btn:hover {
            background: rgba(255, 0, 0, 0.8);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        /* Show button class (triggered by JS) */
        #exit-fullscreen-btn.show {
            opacity: 1;
        }

        /* Hide buttons based on fullscreen state (toggled by JS) */
        body.is-fullscreen #enter-fullscreen-btn {
            display: none;
        }

        body:not(.is-fullscreen) #exit-fullscreen-btn {
            display: none;
        }

        /* Hard Reset Button */
        #hard-reset-btn {
            position: fixed;
            bottom: 80px;  /* Above fullscreen button */
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);  /* Dark background like fullscreen */
            color: white;  /* White icon */
            border: 2px solid rgba(255, 255, 255, 0.3);  /* Border like fullscreen */
            border-radius: 50%;  /* Round background */
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease, background 0.2s ease, transform 0.2s ease, color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            pointer-events: auto;
        }

        /* Button hover effect */
        #hard-reset-btn:hover {
            background: rgba(255, 0, 0, 0.8);  /* Red background on hover */
            color: white;  /* Icon becomes white on hover */
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        /* Show button class (triggered by JS) */
        #hard-reset-btn.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- WiFi Status Icon (Top Right Corner) -->
    <div id="wifi-icon" class="online">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/></svg>
    </div>

    <!-- Activation Screen (pending approval) -->
    <div id="activation-screen">
        <div class="activation-card">
            <h1>📺 Digital Signage</h1>

            <div id="activation-code">------</div>

            <div class="spinner"></div>

            <p id="status-message">⏳ Initializing...</p>

            <p style="margin-top: 1.5rem; font-size: 1rem; opacity: 0.8;">
                Admin will approve this device in the Web Admin panel
            </p>
        </div>
    </div>

    <!-- Player Container (iframe) -->
    <div id="player-container">
        <iframe id="player-iframe" allow="autoplay"></iframe>
        <div id="error-message"></div>
    </div>

    <!-- Enter Fullscreen Button (hover to show) - OUTSIDE player container -->
    <button id="enter-fullscreen-btn" title="Enter Fullscreen (F)">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>

    <!-- Exit Fullscreen Button (hover to show) - OUTSIDE player container -->
    <button id="exit-fullscreen-btn" title="Exit Fullscreen (Esc)">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
    </button>

    <!-- Hard Reset Button (hover to show) - OUTSIDE player container -->
    <button id="hard-reset-btn" title="Hard Reset Device (Password Required)">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>

    <!-- Shell Info (debug - press 's' to toggle) -->
    <div id="shell-info">
        <strong>SHELL STATUS</strong><br>
        Device ID: <span id="debug-device-id">-</span><br>
        Status: <span id="debug-status">-</span><br>
        Logger: <span id="debug-logger">Active ✅</span><br>
        Heartbeat: <span id="debug-heartbeat">-</span>
    </div>

    <!-- Environment Configuration - MUST load first -->
    <script src="js/config/env.js?v=20251027-env"></script>

    <!-- API Client - Standardized response wrapper (load before shell modules) -->
    <script src="js/shared/api-client.js?v=20251027-standardized-api"></script>

    <!-- Shell Modules (STABLE CORE) - Load in correct order -->
    <script src="js/shell/config.js?v=20251025-27"></script>
    <script src="js/shell/logger.js?v=20251025-27"></script>
    <script src="js/shell/wifi-status.js?v=20251026-lucide-svg"></script>
    <script src="js/shell/network-diagnostics.js?v=20251025-27"></script>
    <script src="js/shell/registration.js?v=20251027-api-client"></script>
    <script src="js/shell/heartbeat.js?v=20251027-api-client"></script>
    <script src="js/shell/activation-poll.js?v=20251027-api-client"></script>
    <script src="js/shell/commands.js?v=20251027-api-client"></script>
    <script src="js/shell/display-settings.js?v=20251025-27"></script>
    <script src="js/shell/ui.js?v=20251025-27"></script>
    <script src="js/shell/init.js?v=20251026-fix-duplicate-device"></script>

    <!-- Keyboard Shortcuts & Fullscreen Management -->
    <script>
        let hideButtonTimer = null;

        // Track fullscreen state
        function updateFullscreenState() {
            const playerContainer = document.getElementById('player-container');
            const exitBtn = document.getElementById('exit-fullscreen-btn');
            const enterBtn = document.getElementById('enter-fullscreen-btn');

            const isFullscreen = !!document.fullscreenElement;
            console.log('[Shell] Fullscreen state changed:', isFullscreen);

            if (isFullscreen) {
                console.log('[Shell] Entering fullscreen mode');
                playerContainer.classList.add('fullscreen');
                document.body.classList.add('is-fullscreen');
                // Show exit button initially for 3 seconds
                showExitButton();
                // Hide enter button
                if (enterBtn) enterBtn.classList.remove('show');

                // Wait for browser to finish fullscreen transition, then update
                setTimeout(() => {
                    // Recalculate rotation with new viewport dimensions
                    console.log('[Shell] Recalculating rotation for fullscreen viewport...');
                    if (window.ShellDisplaySettings && window.ShellDisplaySettings.applyRotation) {
                        window.ShellDisplaySettings.applyRotation();
                    }

                    // Reload player to update viewport size (ONLY if device is activated)
                    if (window.ShellState && window.ShellState.isActivated) {
                        console.log('[Shell] Reloading player for new viewport size...');
                        if (window.ShellUI && window.ShellUI.loadPlayer) {
                            window.ShellUI.loadPlayer();
                        }
                    } else {
                        console.log('[Shell] Device not activated yet, skip player reload');
                    }
                }, 100); // Small delay for browser to complete fullscreen
            } else {
                console.log('[Shell] Exiting fullscreen mode');
                playerContainer.classList.remove('fullscreen');
                document.body.classList.remove('is-fullscreen');
                // Hide exit button
                if (exitBtn) exitBtn.classList.remove('show');

                // Wait for browser to finish fullscreen exit, then update
                setTimeout(() => {
                    // Recalculate rotation with normal viewport dimensions
                    console.log('[Shell] Recalculating rotation for normal viewport...');
                    if (window.ShellDisplaySettings && window.ShellDisplaySettings.applyRotation) {
                        window.ShellDisplaySettings.applyRotation();
                    }

                    // Reload player to restore normal viewport size (ONLY if device is activated)
                    if (window.ShellState && window.ShellState.isActivated) {
                        console.log('[Shell] Reloading player for normal viewport size...');
                        if (window.ShellUI && window.ShellUI.loadPlayer) {
                            window.ShellUI.loadPlayer();
                        }
                    } else {
                        console.log('[Shell] Device not activated yet, skip player reload');
                    }
                }, 100); // Small delay for browser to complete fullscreen exit
            }
        }

        // Show exit button and auto-hide after 3 seconds
        function showExitButton() {
            const exitBtn = document.getElementById('exit-fullscreen-btn');
            exitBtn.classList.add('show');

            // Clear existing timer
            if (hideButtonTimer) {
                clearTimeout(hideButtonTimer);
            }

            // Auto-hide after 3 seconds
            hideButtonTimer = setTimeout(() => {
                exitBtn.classList.remove('show');
            }, 3000);
        }

        // Show enter button and auto-hide after 3 seconds
        function showEnterButton() {
            const enterBtn = document.getElementById('enter-fullscreen-btn');
            enterBtn.classList.add('show');

            // Clear existing timer
            if (hideButtonTimer) {
                clearTimeout(hideButtonTimer);
            }

            // Auto-hide after 3 seconds
            hideButtonTimer = setTimeout(() => {
                enterBtn.classList.remove('show');
            }, 3000);
        }

        // Show reset button and auto-hide after 3 seconds
        function showResetButton() {
            const resetBtn = document.getElementById('hard-reset-btn');
            resetBtn.classList.add('show');

            // Clear existing timer
            if (hideButtonTimer) {
                clearTimeout(hideButtonTimer);
            }

            // Auto-hide after 3 seconds
            hideButtonTimer = setTimeout(() => {
                resetBtn.classList.remove('show');
            }, 3000);
        }

        // Track mouse movement to show appropriate button
        document.addEventListener('mousemove', (e) => {
            const screenWidth = window.innerWidth;
            const mouseX = e.clientX;

            // Show reset button when hovering on right edge (last 100px)
            if (mouseX > screenWidth - 100) {
                showResetButton();
            }

            if (document.fullscreenElement) {
                // In fullscreen - show exit button
                showExitButton();
            } else {
                // Not in fullscreen - show enter button
                showEnterButton();
            }
        });

        // Listen for fullscreen changes
        document.addEventListener('fullscreenchange', updateFullscreenState);
        document.addEventListener('webkitfullscreenchange', updateFullscreenState);
        document.addEventListener('mozfullscreenchange', updateFullscreenState);
        document.addEventListener('MSFullscreenChange', updateFullscreenState);

        // Enter fullscreen button click
        const enterBtn = document.getElementById('enter-fullscreen-btn');
        if (enterBtn) {
            enterBtn.addEventListener('click', () => {
                console.log('[Shell] Enter button clicked');
                if (!document.fullscreenElement) {
                    console.log('[Shell] Entering fullscreen via button...');
                    const elem = document.documentElement;
                    const requestFullscreen = elem.requestFullscreen ||
                                             elem.webkitRequestFullscreen ||
                                             elem.mozRequestFullScreen ||
                                             elem.msRequestFullscreen;

                    if (requestFullscreen) {
                        requestFullscreen.call(elem).then(() => {
                            console.log('[Shell] ✅ Fullscreen entered successfully');
                        }).catch(err => {
                            console.error('[Shell] ❌ Fullscreen error:', err);
                        });
                    }
                } else {
                    console.log('[Shell] Already in fullscreen');
                }
            });
            console.log('[Shell] Enter button listener attached');
        } else {
            console.error('[Shell] Enter button not found!');
        }

        // Exit fullscreen button click
        const exitBtn = document.getElementById('exit-fullscreen-btn');
        if (exitBtn) {
            exitBtn.addEventListener('click', () => {
                console.log('[Shell] Exit button clicked');
                if (document.fullscreenElement) {
                    console.log('[Shell] Exiting fullscreen via button...');
                    document.exitFullscreen();
                } else {
                    console.log('[Shell] Already not in fullscreen');
                }
            });
            console.log('[Shell] Exit button listener attached');
        } else {
            console.error('[Shell] Exit button not found!');
        }

        // Hard reset button click (with password protection)
        const resetBtn = document.getElementById('hard-reset-btn');
        let isResetting = false; // Prevent double-click

        if (resetBtn) {
            resetBtn.addEventListener('click', async () => {
                // Prevent double-click during reset
                if (isResetting) {
                    console.warn('[Shell] Hard reset already in progress, ignoring click');
                    return;
                }

                console.log('[Shell] Hard reset button clicked');

                // Prompt for password
                const password = prompt('⚠️ WARNING: This will ERASE ALL DATA and require re-activation.\n\nEnter admin password to confirm:');

                if (!password) {
                    console.log('[Shell] Hard reset cancelled (no password)');
                    return;
                }

                // Simple password check (loaded from ENV config)
                const RESET_PASSWORD = window.ENV?.RESET_PASSWORD || 'admin123';

                if (password !== RESET_PASSWORD) {
                    alert('❌ Incorrect password! Reset cancelled.');
                    console.error('[Shell] Hard reset failed - wrong password');
                    return;
                }

                // Set flag to prevent double execution
                isResetting = true;
                console.log('[Shell] Password verified, executing hard reset...');

                // Log BEFORE clear
                console.log('[Shell] 📊 BEFORE clear - localStorage:', {
                    deviceId: localStorage.getItem('device_id'),
                    status: localStorage.getItem('device_status'),
                    code: localStorage.getItem('device_code')
                });

                // Clear localStorage
                localStorage.clear();

                // Verify cleared
                console.log('[Shell] 📊 AFTER clear - localStorage:', {
                    deviceId: localStorage.getItem('device_id'),
                    status: localStorage.getItem('device_status'),
                    code: localStorage.getItem('device_code')
                });
                console.log('[Shell] ✅ localStorage cleared');

                // Clear IndexedDB cache (if PlayerCache available)
                let reloadExecuted = false; // Prevent multiple reloads

                const executeReload = () => {
                    if (!reloadExecuted) {
                        reloadExecuted = true;
                        console.log('[Shell] 🔄 Reloading page to complete hard reset...');
                        setTimeout(() => location.reload(), 100); // Small delay for logs
                    }
                };

                try {
                    // Try to open PlayerCache DB and clear it
                    const dbName = 'signage_media_cache';
                    const deleteRequest = indexedDB.deleteDatabase(dbName);

                    deleteRequest.onsuccess = () => {
                        console.log('[Shell] ✅ IndexedDB cache deleted');
                        executeReload();
                    };

                    deleteRequest.onerror = () => {
                        console.error('[Shell] ⚠️ IndexedDB delete failed, reloading anyway');
                        executeReload();
                    };

                    deleteRequest.onblocked = () => {
                        console.warn('[Shell] ⚠️ IndexedDB delete blocked, reloading anyway');
                        executeReload();
                    };

                    // Fallback: If nothing happens in 2 seconds, reload anyway
                    setTimeout(() => {
                        if (!reloadExecuted) {
                            console.warn('[Shell] ⚠️ IndexedDB delete timeout, reloading...');
                            executeReload();
                        }
                    }, 2000);
                } catch (error) {
                    console.error('[Shell] ⚠️ Error deleting IndexedDB:', error);
                    executeReload();
                }
            });
            console.log('[Shell] Hard reset button listener attached');
        } else {
            console.error('[Shell] Hard reset button not found!');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Press 's' to toggle shell debug info
            if (e.key === 's' || e.key === 'S') {
                const info = document.getElementById('shell-info');
                info.style.display = info.style.display === 'none' ? 'block' : 'none';

                // Update debug info
                document.getElementById('debug-device-id').textContent = localStorage.getItem('device_id') || '-';
                document.getElementById('debug-status').textContent = localStorage.getItem('device_status') || '-';
            }

            // Press 'r' to reload player only (not shell)
            if (e.key === 'r' || e.key === 'R') {
                if (window.reloadPlayer) {
                    window.reloadPlayer();
                }
            }

            // Press 'f' to toggle fullscreen
            if (e.key === 'f' || e.key === 'F') {
                console.log('[Shell] F key pressed, current fullscreen state:', !!document.fullscreenElement);

                if (!document.fullscreenElement) {
                    // Enter fullscreen
                    console.log('[Shell] Attempting to enter fullscreen...');

                    const elem = document.documentElement;
                    const requestFullscreen = elem.requestFullscreen ||
                                             elem.webkitRequestFullscreen ||
                                             elem.mozRequestFullScreen ||
                                             elem.msRequestFullscreen;

                    if (requestFullscreen) {
                        requestFullscreen.call(elem).then(() => {
                            console.log('[Shell] ✅ Fullscreen entered successfully');
                        }).catch(err => {
                            console.error('[Shell] ❌ Fullscreen error:', err);
                            alert('Fullscreen failed: ' + err.message);
                        });
                    } else {
                        console.error('[Shell] ❌ Fullscreen API not supported');
                        alert('Fullscreen not supported in this browser');
                    }
                } else {
                    // Exit fullscreen
                    console.log('[Shell] Exiting fullscreen...');
                    document.exitFullscreen();
                }
            }

            // Press 'Esc' to exit fullscreen
            if (e.key === 'Escape' && document.fullscreenElement) {
                document.exitFullscreen();
            }
        });

        // Initial state
        updateFullscreenState();
    </script>
</body>
</html>
