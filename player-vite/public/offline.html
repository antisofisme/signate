<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Offline - Digital Signage Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }

    .icon-container {
      margin-bottom: 2rem;
      position: relative;
    }

    .icon {
      font-size: 5rem;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.95); }
    }

    .status-dot {
      position: absolute;
      bottom: 0;
      right: 50%;
      transform: translateX(3rem);
      width: 20px;
      height: 20px;
      background: #ef4444;
      border-radius: 50%;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #f8fafc;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .info-box p {
      color: #cbd5e1;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .retry-btn {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .retry-btn:hover {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .retry-btn:active {
      transform: translateY(0);
    }

    .retry-btn svg {
      width: 18px;
      height: 18px;
    }

    .auto-retry {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #64748b;
    }

    .auto-retry span {
      color: #3b82f6;
      font-weight: 600;
    }

    /* Background decoration */
    .bg-decoration {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .bg-decoration::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
    }
  </style>
</head>
<body>
  <div class="bg-decoration"></div>

  <div class="container">
    <div class="icon-container">
      <div class="icon">📡</div>
      <div class="status-dot"></div>
    </div>

    <h1>Connection Lost</h1>
    <p class="subtitle">The player is currently offline and unable to connect to the server.</p>

    <div class="info-box">
      <p>Don't worry! The player will automatically reconnect when the network becomes available. Any cached content will continue to play.</p>
    </div>

    <button class="retry-btn" onclick="retryConnection()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"/>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
        <path d="M3 22v-6h6"/>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
      Try Again
    </button>

    <p class="auto-retry">Auto-retry in <span id="countdown">30</span> seconds</p>
  </div>

  <script>
    let countdown = 30;
    const countdownEl = document.getElementById('countdown');

    function retryConnection() {
      window.location.reload();
    }

    // Auto-retry countdown
    setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        retryConnection();
      } else {
        countdownEl.textContent = countdown;
      }
    }, 1000);

    // Listen for online event
    window.addEventListener('online', () => {
      console.log('[Offline Page] Network restored, reloading...');
      setTimeout(retryConnection, 1000);
    });
  </script>
</body>
</html>
