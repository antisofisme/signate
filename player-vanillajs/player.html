<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Content Display */
        #content-display {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
        }

        /* Base content styling */
        #content-display img,
        #content-display video {
            max-width: 100%;
            max-height: 100%;
        }

        /* Landscape content - fit width (kanan-kiri) */
        #content-display img.landscape,
        #content-display video.landscape {
            width: 100%;
            height: auto;
        }

        /* Portrait content - fit height (atas-bawah) */
        #content-display img.portrait,
        #content-display video.portrait {
            height: 100%;
            width: auto;
        }

        /* Loading State */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error State */
        #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ff6b6b;
            padding: 30px;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 15px;
            display: none;
        }

        /* Player Info (debug overlay) */
        #player-info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Content Display Area -->
    <div id="content-display">
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading content...</p>
        </div>

        <div id="error">
            <h2>⚠️ Player Error</h2>
            <p id="error-message"></p>
            <p style="margin-top: 15px; font-size: 14px; opacity: 0.7;">
                Retrying automatically...
            </p>
        </div>
    </div>

    <!-- Player Debug Info -->
    <div id="player-info">
        <strong>PLAYER STATUS</strong><br>
        Content: <span id="debug-content">-</span><br>
        Index: <span id="debug-index">0</span>/<span id="debug-total">0</span><br>
        Type: <span id="debug-type">-</span><br>
        Cache: <span id="debug-cache">-</span>
    </div>

    <!-- Player Modules (Load in correct order) -->
    <script src="js/core/config/config.js?v=20251025-28"></script>
    <!-- API Client - Standardized response wrapper (load before player modules) -->
    <script src="js/core/api/api-client.js?v=20251027-standardized-api"></script>

    <script src="js/core/utils/logger.js?v=20251025-28"></script>
    <script src="js/core/storage/cache.js?v=20251025-28"></script>
    <script src="js/player/services/api.js?v=20251027-api-client"></script>
    <script src="js/player/services/playback.js?v=20251025-28"></script>
    <script src="js/player/ui/ui.js?v=20251025-28"></script>
    <script src="js/player/init.js?v=20251025-28"></script>
</body>
</html>
