<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="styles/player.css">
</head>
<body>
    <!-- Content Display Area -->
    <div id="content-display">
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading content...</p>
        </div>

        <div id="error">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 8px;">
                    <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/>
                    <path d="M12 9v4"/>
                    <path d="M12 17h.01"/>
                </svg>
                Player Error
            </h2>
            <p id="error-message"></p>
            <p style="margin-top: 15px; font-size: 14px; opacity: 0.7;">
                Retrying automatically...
            </p>
        </div>
    </div>

    <!-- Player Debug Info -->
    <div id="player-info">
        <strong>PLAYER STATUS</strong><br>
        Content: <span id="debug-content">-</span><br>
        Index: <span id="debug-index">0</span>/<span id="debug-total">0</span><br>
        Type: <span id="debug-type">-</span><br>
        Cache: <span id="debug-cache">-</span>
    </div>

    <!-- Player Modules (Load in correct order) -->
    <script src="js/core/config/config.js?v=20251025-28"></script>
    <!-- API Client - Standardized response wrapper (load before player modules) -->
    <script src="js/core/api/api-client.js?v=20251027-standardized-api"></script>

    <script src="js/core/utils/logger.js?v=20251025-28"></script>

    <!-- Phase 3: EventBus (load before models/state) -->
    <script src="js/core/utils/eventBus.js?v=20251103-phase3"></script>

    <!-- Phase 3: Model Classes (load before state and services) -->
    <script src="js/player/models/Segment.js?v=20251103-phase3"></script>
    <script src="js/player/models/Content.js?v=20251103-phase3"></script>
    <script src="js/player/models/Playlist.js?v=20251103-phase3"></script>

    <!-- Phase 3: Reactive State Management (load before services) -->
    <script src="js/player/state/playerState.js?v=20251103-phase3"></script>

    <!-- Player Services -->
    <script src="js/core/storage/cache.js?v=20251025-28"></script>
    <script src="js/player/services/api.js?v=20251027-api-client"></script>
    <script src="js/player/services/playback.js?v=20251025-28"></script>
    <script src="js/player/ui/ui.js?v=20251025-28"></script>

    <!-- Player Initialization (load last) -->
    <script src="js/player/init.js?v=20251103-init"></script>
</body>
</html>
