<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Digital Signage</title>
    <link rel="stylesheet" href="styles/offline.css">
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h.01"/>
                <path d="M8.5 16.429a5 5 0 0 1 7 0"/>
                <path d="M5 12.859a10 10 0 0 1 14 0"/>
                <path d="M2 8.82a15 15 0 0 1 20 0"/>
            </svg>
        </div>

        <h1>You're Offline</h1>
        <p>Unable to connect to the server</p>

        <div class="status-message">
            <p id="status-text">
                <span class="spinner"></span>
                Checking connection...
            </p>
        </div>

        <button class="retry-button" onclick="retryConnection()">
            Retry Connection
        </button>

        <div class="connection-status" id="connection-info">
            Last attempt: <span id="last-attempt">Just now</span>
        </div>

        <div class="tips">
            <h3>Troubleshooting Tips:</h3>
            <ul>
                <li>Check your network connection</li>
                <li>Verify the server is running</li>
                <li>Check if the backend API is accessible</li>
                <li>Try reloading the page</li>
                <li>Clear browser cache if issue persists</li>
            </ul>
        </div>
    </div>

    <!-- Offline Handler Module -->
    <script src="js/core/ui/offline-handler.js"></script>
</body>
</html>
