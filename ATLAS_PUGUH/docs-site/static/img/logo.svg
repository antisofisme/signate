<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Scale of Justice -->
  <g fill="url(#grad1)">
    <!-- Central pillar -->
    <rect x="45" y="30" width="10" height="50" rx="2"/>
    <!-- Base -->
    <rect x="25" y="75" width="50" height="8" rx="4"/>
    <!-- Top beam -->
    <rect x="15" y="25" width="70" height="8" rx="4"/>
    <!-- Left pan holder -->
    <rect x="20" y="30" width="4" height="20"/>
    <!-- Right pan holder -->
    <rect x="76" y="30" width="4" height="20"/>
    <!-- Left pan -->
    <ellipse cx="22" cy="52" rx="15" ry="5"/>
    <!-- Right pan -->
    <ellipse cx="78" cy="52" rx="15" ry="5"/>
    <!-- Decorative circle at top -->
    <circle cx="50" cy="20" r="8"/>
  </g>
</svg>
