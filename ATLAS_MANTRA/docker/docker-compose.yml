version: '3.8'

# ATLAS_MANTRA Docker Compose
# Decision Matrix Constitutional Law System
#
# SECURITY MODEL:
#   POSTGRES_USER (mantra_owner): Database owner. Migration only.
#   DB_APP_USER (mantra_app): Application role. SELECT + INSERT only.
#
# The backend MUST connect as mantra_app, NEVER as mantra_owner.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mantra-postgres
    restart: unless-stopped
    environment:
      # Owner role - for migrations and schema management ONLY
      POSTGRES_USER: ${POSTGRES_OWNER:-mantra_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-owner_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-atlas_mantra}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER:-mantra_owner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mantra-backend
    restart: unless-stopped
    environment:
      # CRITICAL: App connects as mantra_app (restricted role)
      # NOT as database owner. This is CONSTITUTIONAL.
      DATABASE_URL: postgresql://${DB_APP_USER:-mantra_app}:${DB_APP_PASSWORD:-app_secret_change_me}@postgres:5432/${POSTGRES_DB:-atlas_mantra}
      HOST: 0.0.0.0
      PORT: 8001
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (optional - for development)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: mantra-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    profiles:
      - full

volumes:
  postgres_data:

networks:
  default:
    name: mantra-network
