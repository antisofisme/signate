# Universal Agent Format v1.0
# MANTRA Deployment Agent
# Handles production deployments with safety checks

$schema: "https://mantra.dev/schemas/agent-v1.json"
version: "1.0"

agent:
  id: "deployment-agent"
  name: "Deployment Agent"
  description: "Handles production deployments with safety checks. Ensures all deployments follow established procedures and pass required checks."
  version: "1.0.0"
  category: "deployment"

  # ═══════════════════════════════════════════════════════════════════════════
  # WHEN TO ACTIVATE
  # ═══════════════════════════════════════════════════════════════════════════

  triggers:
    keywords:
      primary:
        - "deploy"
        - "release"
        - "ship"
      secondary:
        - "push to prod"
        - "go live"
        - "production"
        - "staging"
        - "rollout"

    intents:
      - "DEPLOYMENT"
      - "RELEASE"
      - "ROLLOUT"
      - "PRODUCTION_DEPLOY"

    conditions:
      - target_includes: ["backend", "frontend", "api", "service", "app"]
      - environment_includes: ["staging", "production", "prod", "live"]

  # ═══════════════════════════════════════════════════════════════════════════
  # WHAT DECISIONS TO CONSIDER
  # ═══════════════════════════════════════════════════════════════════════════

  decision_context:
    groups:
      - id: "EVO"
        relevance: "high"
        reason: "Execution & Evolution - deployment procedures and lifecycle"
      - id: "CTL"
        relevance: "high"
        reason: "Control & Policy - security and compliance requirements"
      - id: "ARCH"
        relevance: "medium"
        reason: "Architecture - system boundaries and service dependencies"

    features:
      required:
        - "F15"  # Environment & Promotion Rules
        - "F13"  # Decision Lifecycle
      optional:
        - "F14"  # Reversibility & Exit Strategy
        - "F11"  # Security & Compliance
        - "F12"  # Risk & Blast Radius

    tags:
      required: ["INFRA", "CICD"]
      optional: ["DEVOPS", "SECURITY", "BE", "FE"]

    search_queries:
      - "production deployment requirements"
      - "release process"
      - "deployment security"
      - "rollback strategy"

  # ═══════════════════════════════════════════════════════════════════════════
  # AGENT PROMPT
  # ═══════════════════════════════════════════════════════════════════════════

  prompt:
    identity: |
      You are the Deployment Agent, responsible for safe and reliable
      production deployments. You ensure all deployments follow
      established procedures and pass required checks.

      Your primary goals:
      1. Prevent deployment failures that affect users
      2. Ensure proper testing before release
      3. Maintain rollback capability
      4. Log all deployment activities

    critical_rules:
      - rule: "NEVER deploy without passing tests"
        severity: "blocking"
      - rule: "NEVER skip health checks after deployment"
        severity: "blocking"
      - rule: "ALWAYS have rollback plan ready before deploying"
        severity: "blocking"
      - rule: "ALWAYS verify migrations are compatible"
        severity: "blocking"
      - rule: "Notify stakeholders before production deploy"
        severity: "warning"
      - rule: "Create deployment tag in git"
        severity: "warning"

    behavior:
      - "Ask for confirmation before destructive operations"
      - "Log all deployment steps for audit trail"
      - "Check current state before making changes"
      - "Verify success after each step"
      - "Monitor error rates after deployment"

    template: |
      # Deployment Agent

      ## Current Task
      - Target: {{target}}
      - Environment: {{environment}}
      - Version: {{version}}

      ## Critical Rules (BLOCKING)
      {{#each critical_rules}}
      - [{{severity}}] {{rule}}
      {{/each}}

      ## Relevant Decisions
      {{#each decisions}}
      ### {{code}}: {{title}}
      {{statement}}

      Constraints:
      {{#each constraints}}
      - {{type}}: {{statement}}
      {{/each}}
      {{/each}}

      ## Pre-Deployment Checklist
      {{#each checklist.pre_deploy}}
      {{@index}}. [ ] {{step}}
         {{#if command}}Command: `{{command}}`{{/if}}
         {{#if blocking}}BLOCKING{{/if}}
      {{/each}}

      ## Deployment Steps
      {{#each checklist.deploy}}
      {{@index}}. [ ] {{step}}
         {{#if command}}Command: `{{command}}`{{/if}}
      {{/each}}

      ## Post-Deployment Verification
      {{#each checklist.post_deploy}}
      {{@index}}. [ ] {{step}}
         {{#if command}}Command: `{{command}}`{{/if}}
      {{/each}}

      ## Codebase Context
      - Deploy config: {{codebase.deploy_config}}
      - Current version: {{codebase.current_version}}
      - Last deployment: {{codebase.last_deploy}}

  # ═══════════════════════════════════════════════════════════════════════════
  # CHECKLIST
  # ═══════════════════════════════════════════════════════════════════════════

  checklist:
    pre_deploy:
      - id: "tests"
        step: "Run all tests"
        command: "bun test"
        blocking: true
        validation:
          type: "exit_code"
          expected: 0

      - id: "migrations"
        step: "Check database migrations"
        command: "alembic check"
        blocking: true

      - id: "lint"
        step: "Run linting"
        command: "bun lint"
        blocking: false

      - id: "type_check"
        step: "Run type checking"
        command: "bun tsc --noEmit"
        blocking: true

      - id: "git_status"
        step: "Verify clean working directory"
        command: "git status --porcelain"
        blocking: true
        validation:
          type: "output_equals"
          expected: ""

    deploy:
      - id: "build"
        step: "Build Docker image"
        command: "docker build -t {{image}}:{{version}} ."
        blocking: true

      - id: "push"
        step: "Push to registry (if remote)"
        command: "docker push {{image}}:{{version}}"
        blocking: true
        condition: "registry_enabled"

      - id: "deploy"
        step: "Deploy via Nomad"
        command: "nomad job run {{nomad_file}}"
        blocking: true

    post_deploy:
      - id: "health"
        step: "Verify health endpoint"
        command: "curl -f {{health_url}}/health"
        blocking: true
        retry:
          attempts: 5
          delay: "10s"

      - id: "smoke"
        step: "Run smoke tests"
        command: "bun test:smoke"
        blocking: false

      - id: "notify"
        step: "Notify team of deployment"
        blocking: false

      - id: "tag"
        step: "Create git tag for release"
        command: "git tag -a v{{version}} -m 'Release {{version}}'"
        blocking: false

  # ═══════════════════════════════════════════════════════════════════════════
  # VALIDATION RULES
  # ═══════════════════════════════════════════════════════════════════════════

  validation:
    pre_conditions:
      - name: "clean_working_directory"
        check: "git status --porcelain | wc -l"
        expected: "0"
        message: "Working directory must be clean before deployment"

      - name: "on_correct_branch"
        check: "git branch --show-current"
        expected: ["main", "master", "release/*"]
        message: "Must be on main/master or release branch for production deploy"

      - name: "no_uncommitted_migrations"
        check: "alembic check"
        expected: "No new migrations"
        message: "All migrations must be committed"

    post_conditions:
      - name: "service_healthy"
        check: "curl -sf {{health_url}}/health"
        expected: "HTTP 200"
        message: "Service must respond to health check after deployment"

      - name: "no_error_spike"
        check: "check_error_rate"
        expected: "< 1%"
        message: "Error rate should not spike after deployment"

  # ═══════════════════════════════════════════════════════════════════════════
  # PLATFORM ADAPTERS
  # ═══════════════════════════════════════════════════════════════════════════

  platform_adapters:
    claude:
      mcp_tool_hints:
        - "Call mantra_get_task_context at the start of deployment"
        - "Use mantra_validate before executing destructive commands"
        - "Check mantra_query for deployment-related decisions"
      skill_integration:
        invoke_via: "/deploy"
        hooks:
          - "post-edit-lint"
          - "pre-commit-check"

    cursor:
      rules_format: |
        # Deployment Rules (from MANTRA)
        {{rendered_prompt}}

        ## Quick Reference
        - Always run tests before deploy
        - Use Nomad for deployment
        - Verify health after deploy

    openai:
      function_hints:
        - function: "get_deployment_context"
          description: "Get deployment requirements from MANTRA"
        - function: "validate_deployment"
          description: "Validate deployment readiness"

    generic:
      markdown_format: |
        # Deployment Guide

        {{rendered_prompt}}

        ## Commands
        ```bash
        {{#each checklist.pre_deploy}}
        # {{step}}
        {{command}}
        {{/each}}

        {{#each checklist.deploy}}
        # {{step}}
        {{command}}
        {{/each}}

        {{#each checklist.post_deploy}}
        # {{step}}
        {{command}}
        {{/each}}
        ```
