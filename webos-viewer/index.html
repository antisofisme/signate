<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS TV Digital Signage</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Activation Screen -->
    <div id="activation-screen">
        <h1>WebOS TV Digital Signage</h1>
        <p style="font-size: 1.2rem; margin-bottom: 1rem; opacity: 0.9;">Device UUID:</p>
        <div id="device-uuid" style="font-size: 2.5rem; font-weight: bold; font-family: 'Courier New', monospace; padding: 1.5rem 3rem; background: rgba(255,255,255,0.2); border-radius: 15px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); margin-bottom: 2rem;">------</div>
        <div class="spinner"></div>
        <p id="status-message" style="font-size: 1.5rem; margin-top: 1.5rem;">⏳ Menunggu persetujuan dari server...</p>
        <p style="margin-top: 1rem; font-size: 1rem; opacity: 0.7;">Admin akan menyetujui perangkat ini di Web Admin</p>
    </div>

    <!-- Content Player -->
    <div id="content-player"></div>

    <!-- Debug Info -->
    <div id="debug-info">
        <div><strong>Debug Info</strong></div>
        <div id="debug-device-id">Device ID: -</div>
        <div id="debug-status">Status: Initializing</div>
        <div id="debug-playlist-count">Playlist: 0 items</div>
        <div id="debug-current-index">Current: -</div>
        <div id="debug-next-change">Next change: -</div>
        <div><small>Keys: d=toggle, f=fullscreen, n=next, r=reload, x=reset</small></div>
    </div>

    <!-- Error Message -->
    <div id="error-message" class="error-message"></div>

    <!-- Load and initialize application -->
    <script type="module">
        // Cache busting for module updates - increment v parameter when JS changes
        import { init } from './js/app.js?v=20251024-2';

        // Initialize the application when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
