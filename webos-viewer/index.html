<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS TV Digital Signage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* Activation Screen */
        #activation-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #activation-screen h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }


        #activation-screen p {
            font-size: 1.5rem;
            opacity: 0.9;
        }

        /* Content Player */
        #content-player {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        #content-player.active {
            display: block;
        }

        .content-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Direct replacement - no transition, no opacity, no flicker */
        }

        /* Debug Info */
        #debug-info {
            display: none;
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 9999;
            max-width: 300px;
        }

        #debug-info.visible {
            display: block;
        }

        #debug-info div {
            margin: 3px 0;
        }

        /* Loading Spinner */
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error Message */
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,0,0,0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 1.2rem;
            z-index: 10000;
            display: none;
        }

        .error-message.visible {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Activation Screen -->
    <div id="activation-screen">
        <h1>WebOS TV Digital Signage</h1>
        <p style="font-size: 1.2rem; margin-bottom: 1rem; opacity: 0.9;">Device UUID:</p>
        <div id="device-uuid" style="font-size: 2.5rem; font-weight: bold; font-family: 'Courier New', monospace; padding: 1.5rem 3rem; background: rgba(255,255,255,0.2); border-radius: 15px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); margin-bottom: 2rem;">------</div>
        <div class="spinner"></div>
        <p id="status-message" style="font-size: 1.5rem; margin-top: 1.5rem;">⏳ Menunggu persetujuan dari server...</p>
        <p style="margin-top: 1rem; font-size: 1rem; opacity: 0.7;">Admin akan menyetujui perangkat ini di Web Admin</p>
    </div>

    <!-- Content Player -->
    <div id="content-player"></div>

    <!-- Debug Info -->
    <div id="debug-info">
        <div><strong>Debug Info</strong></div>
        <div id="debug-device-id">Device ID: -</div>
        <div id="debug-status">Status: Initializing</div>
        <div id="debug-playlist-count">Playlist: 0 items</div>
        <div id="debug-current-index">Current: -</div>
        <div id="debug-next-change">Next change: -</div>
        <div><small>Keys: d=toggle, f=fullscreen, n=next, r=reload, x=reset</small></div>
    </div>

    <!-- Error Message -->
    <div id="error-message" class="error-message"></div>

    <script>
        // Configuration
        const API_BASE_URL = 'http://192.168.5.12:8001';
        const POLL_INTERVAL = 5000; // 5 seconds
        const PRELOAD_TIME = 3000; // 3 seconds
        const HEARTBEAT_INTERVAL = 30000; // 30 seconds before end
        const DB_NAME = 'SignageMediaCache';
        const DB_VERSION = 1;
        const STORE_NAME = 'mediaFiles';

        // State
        let deviceId = null;
        let deviceUUID = null;  // Permanent device identifier
        let isActivated = false;
        let playlist = [];
        let currentIndex = 0;
        let currentContentElement = null;
        let nextContentElement = null;
        let contentTimer = null;
        let pollTimer = null;
        let playlistRefreshTimer = null;
        let heartbeatTimer = null;
        let db = null; // IndexedDB instance
        let currentBlobUrl = null; // Track current blob URL for cleanup

        // Debug mode
        let debugMode = false;

        // ========================================
        // UUID and WebOS Device Detection
        // ========================================

        // Generate UUID v4 (RFC 4122 compliant)
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Get or create permanent device UUID
        function getOrCreateDeviceUUID() {
            let uuid = localStorage.getItem('device_uuid');
            if (!uuid) {
                uuid = generateUUID();
                localStorage.setItem('device_uuid', uuid);
                console.log('🆕 Generated new device UUID:', uuid);
            } else {
                console.log('✅ Using existing device UUID:', uuid);
            }
            return uuid;
        }

        // Get WebOS device information
        function getWebOSDeviceInfo() {
            const info = {};

            if (typeof window.webOS !== 'undefined') {
                console.log('🖥️  Running on WebOS TV');

                if (window.webOS.deviceInfo) {
                    info.platform = 'webOS';
                    info.modelName = window.webOS.deviceInfo('modelName') || 'Unknown';
                    info.firmwareVersion = window.webOS.deviceInfo('version') || 'Unknown';
                    info.sdkVersion = window.webOS.deviceInfo('sdkVersion') || 'Unknown';
                }

                if (window.webOS.platform && window.webOS.platform.tv) {
                    info.screenWidth = window.webOS.platform.tv.screenWidth || window.screen.width;
                    info.screenHeight = window.webOS.platform.tv.screenHeight || window.screen.height;
                }
            } else {
                info.platform = 'browser';
                info.modelName = 'Browser';
            }

            return info;
        }

        // ========================================
        // IndexedDB Cache Manager
        // ========================================

        // Initialize IndexedDB for offline media caching
        async function initMediaCache() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onerror = () => {
                    console.error('❌ IndexedDB failed to open:', request.error);
                    reject(request.error);
                };

                request.onsuccess = () => {
                    db = request.result;
                    console.log('✅ IndexedDB opened successfully');
                    resolve(db);
                };

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;

                    // Create object store for media files
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        const objectStore = db.createObjectStore(STORE_NAME, { keyPath: 'content_id' });
                        objectStore.createIndex('url', 'url', { unique: false });
                        objectStore.createIndex('timestamp', 'timestamp', { unique: false });
                        console.log('📦 Created media cache object store');
                    }
                };
            });
        }

        // Check if content is cached
        async function isContentCached(contentId) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const objectStore = transaction.objectStore(STORE_NAME);
                const request = objectStore.get(contentId);

                request.onsuccess = () => {
                    resolve(!!request.result);
                };

                request.onerror = () => {
                    reject(request.error);
                };
            });
        }

        // Get cached content
        async function getCachedContent(contentId) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const objectStore = transaction.objectStore(STORE_NAME);
                const request = objectStore.get(contentId);

                request.onsuccess = () => {
                    resolve(request.result);
                };

                request.onerror = () => {
                    reject(request.error);
                };
            });
        }

        // Download and cache content
        async function downloadAndCacheContent(content) {
            try {
                console.log(`⬇️  Downloading content ${content.content_id}: ${content.title}`);

                // Fetch content from URL
                const response = await fetch(content.url);

                if (!response.ok) {
                    throw new Error(`Failed to fetch: ${response.status}`);
                }

                // Get blob data
                const blob = await response.blob();
                const contentType = response.headers.get('content-type') || content.mime_type || 'application/octet-stream';

                // Store in IndexedDB
                const cacheEntry = {
                    content_id: content.content_id,
                    title: content.title,
                    url: content.url,
                    content_type: content.content_type,
                    mime_type: contentType,
                    blob: blob,
                    size: blob.size,
                    timestamp: Date.now()
                };

                await saveToCache(cacheEntry);

                console.log(`✅ Cached content ${content.content_id} (${(blob.size / 1024 / 1024).toFixed(2)} MB)`);
                return cacheEntry;

            } catch (error) {
                console.error(`❌ Failed to cache content ${content.content_id}:`, error);
                return null;
            }
        }

        // Save to cache
        async function saveToCache(cacheEntry) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const objectStore = transaction.objectStore(STORE_NAME);
                const request = objectStore.put(cacheEntry);

                request.onsuccess = () => {
                    resolve();
                };

                request.onerror = () => {
                    reject(request.error);
                };
            });
        }

        // Delete from cache
        async function deleteFromCache(contentId) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const objectStore = transaction.objectStore(STORE_NAME);
                const request = objectStore.delete(contentId);

                request.onsuccess = () => {
                    console.log(`🗑️  Removed content ${contentId} from cache`);
                    resolve();
                };

                request.onerror = () => {
                    reject(request.error);
                };
            });
        }

        // Sync cache with playlist
        async function syncCacheWithPlaylist(newPlaylist) {
            try {
                // Get all cached content IDs
                const cachedIds = await getAllCachedContentIds();
                const playlistIds = newPlaylist.map(item => item.content_id);

                // Find content to remove (in cache but not in playlist)
                const idsToRemove = cachedIds.filter(id => !playlistIds.includes(id));

                // Find content to download (in playlist but not in cache)
                const idsToDownload = playlistIds.filter(id => !cachedIds.includes(id));

                // Remove unused content from cache
                for (const id of idsToRemove) {
                    await deleteFromCache(id);
                }

                // Download new content
                for (const content of newPlaylist) {
                    if (idsToDownload.includes(content.content_id)) {
                        await downloadAndCacheContent(content);
                    }
                }

                console.log(`🔄 Cache synced: +${idsToDownload.length} downloaded, -${idsToRemove.length} removed`);

            } catch (error) {
                console.error('❌ Cache sync failed:', error);
            }
        }

        // Get all cached content IDs
        async function getAllCachedContentIds() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const objectStore = transaction.objectStore(STORE_NAME);
                const request = objectStore.getAllKeys();

                request.onsuccess = () => {
                    resolve(request.result);
                };

                request.onerror = () => {
                    reject(request.error);
                };
            });
        }

        // Get cached blob URL for playback
        async function getCachedBlobUrl(contentId) {
            try {
                const cached = await getCachedContent(contentId);

                if (!cached) {
                    return null;
                }

                // Create blob URL for playback
                const blobUrl = URL.createObjectURL(cached.blob);
                return blobUrl;

            } catch (error) {
                console.error(`❌ Failed to get cached blob URL for ${contentId}:`, error);
                return null;
            }
        }

        // Initialize
        async function init() {
            updateDebug('status', 'Initializing...');

            // Get or create permanent device UUID (FIRST!)
            deviceUUID = getOrCreateDeviceUUID();
            console.log('🔑 Device UUID:', deviceUUID);

            // Display UUID on screen
            document.getElementById('device-uuid').textContent = deviceUUID;

            // Get WebOS device info if available
            const webOSInfo = getWebOSDeviceInfo();
            if (webOSInfo.platform === 'webOS') {
                console.log('📺 WebOS TV Model:', webOSInfo.modelName);
                console.log('📱 Firmware:', webOSInfo.firmwareVersion);
            }

            // Initialize IndexedDB for offline caching
            try {
                await initMediaCache();
                console.log('📦 Media cache initialized');
            } catch (error) {
                console.error('❌ Failed to initialize media cache:', error);
                showError('Failed to initialize offline cache. Content may stream instead of cache.');
            }

            // Check if already registered (from localStorage)
            const savedDeviceId = localStorage.getItem('webos_device_id');
            const savedStatus = localStorage.getItem('webos_status');

            if (savedDeviceId) {
                // Use saved device
                deviceId = savedDeviceId;

                updateDebug('device-id', `Device ID: ${deviceId}`);
                updateDebug('status', 'Using saved device...');

                console.log('Using saved device:', { deviceId, deviceUUID, status: savedStatus });

                // Check if already activated
                if (savedStatus === 'active') {
                    // Already activated, start content player
                    isActivated = true;
                    await onActivated();
                } else {
                    // Still pending, start polling for approval
                    document.getElementById('status-message').textContent = '⏳ Menunggu persetujuan dari server...';
                    startPolling();
                }
            } else {
                // Register new device with UUID
                await registerWebOSDevice();
                startPolling();
            }

            setupKeyboardShortcuts();
        }

        // Generate 6-digit numeric code from UUID (for backend validation)
        function generateNumericCodeFromUUID(uuid) {
            // Remove hyphens and take first 8 hex chars
            const hexPart = uuid.replace(/-/g, '').substring(0, 8);
            // Convert hex to number and take last 6 digits
            const numericCode = parseInt(hexPart, 16) % 1000000;
            // Pad with zeros to ensure 6 digits
            return numericCode.toString().padStart(6, '0');
        }

        // Register WebOS device with UUID (auto-registration)
        async function registerWebOSDevice() {
            try {
                // Get WebOS device info
                const webOSInfo = getWebOSDeviceInfo();

                // Generate device name based on platform
                const deviceName = webOSInfo.platform === 'webOS'
                    ? `${webOSInfo.modelName || 'WebOS TV'} - ${deviceUUID.substring(0, 8)}`
                    : `Browser - ${deviceUUID.substring(0, 8)}`;

                // Generate 6-digit numeric code from UUID
                const activationCode = generateNumericCodeFromUUID(deviceUUID);
                console.log('🔢 Generated activation code from UUID:', activationCode);

                // Auto-register with UUID
                const response = await fetch(`${API_BASE_URL}/api/devices/monitor/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        activation_code: activationCode,  // 6-digit numeric code
                        device_name: deviceName,
                        device_uuid: deviceUUID,
                        platform: webOSInfo.platform || 'browser',
                        model_name: webOSInfo.modelName || 'Unknown'
                    })
                });

                if (!response.ok) {
                    throw new Error(`Registration failed: ${response.status}`);
                }

                const data = await response.json();
                deviceId = data.id;

                // Save to localStorage (using webos_ prefix to differentiate)
                localStorage.setItem('webos_device_id', deviceId);
                localStorage.setItem('webos_status', 'pending');

                updateDebug('device-id', `Device ID: ${deviceId}`);
                updateDebug('status', 'Registered. Waiting for approval...');

                console.log('✅ WebOS device registered:', { deviceId, deviceUUID, deviceName });
                document.getElementById('status-message').textContent = '⏳ Menunggu persetujuan dari server...';
            } catch (error) {
                console.error('❌ Registration error:', error);
                document.getElementById('status-message').textContent = '❌ Gagal registrasi. Retry...';
                showError('Failed to register device. Retrying in 10 seconds...');
                setTimeout(registerWebOSDevice, 10000);
            }
        }

        // Poll approval status using heartbeat endpoint (no auth required)
        async function checkActivationStatus() {
            if (!deviceId || isActivated) return;

            try {
                // Get device info for heartbeat
                const deviceInfo = getDeviceInfo();

                const response = await fetch(`${API_BASE_URL}/api/devices/heartbeat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        device_id: parseInt(deviceId),
                        ...deviceInfo
                    })
                });

                if (!response.ok) {
                    // Device might be deleted, clear localStorage and register new
                    if (response.status === 404) {
                        console.log('⚠️ Device not found (404), re-registering...');
                        document.getElementById('status-message').textContent = '🔄 Re-registering...';
                        stopPolling();
                        localStorage.clear();
                        deviceId = null;
                        deviceUUID = getOrCreateDeviceUUID(); // Keep same UUID
                        isActivated = false;
                        await registerWebOSDevice();
                        startPolling();
                    } else {
                        console.error('Heartbeat failed:', response.status);
                    }
                    return;
                }

                const data = await response.json();
                console.log('💓 Heartbeat response:', data);

                // Update localStorage with current status
                localStorage.setItem('webos_status', data.status);

                // Check if approved (activated)
                if (data.status === 'active' && !isActivated) {
                    console.log('✅ Device approved! Switching to content player...');
                    document.getElementById('status-message').textContent = '✅ Disetujui! Loading content...';
                    isActivated = true;
                    localStorage.setItem('webos_status', 'active');
                    await onActivated();
                }
            } catch (error) {
                console.error('❌ Status check error:', error);
            }
        }

        // Start polling
        function startPolling() {
            pollTimer = setInterval(checkActivationStatus, POLL_INTERVAL);
        }

        // Stop polling
        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        // Collect device information
        function getDeviceInfo() {
            // Get WebOS-specific info
            const webOSInfo = getWebOSDeviceInfo();

            const info = {
                device_uuid: deviceUUID,
                platform: webOSInfo.platform || 'browser',
                model_name: webOSInfo.modelName || 'Unknown',
                firmware_version: webOSInfo.firmwareVersion || 'N/A',
                screen_width: window.screen.width,
                screen_height: window.screen.height,
                viewport_width: window.innerWidth,
                viewport_height: window.innerHeight,
                device_pixel_ratio: window.devicePixelRatio || 1,
                user_agent: navigator.userAgent
            };

            // Get connection information if available
            if (navigator.connection || navigator.mozConnection || navigator.webkitConnection) {
                const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                info.connection_type = connection.effectiveType || connection.type || 'unknown';

                // Calculate speed in Mbps (downlink is in Mbps already)
                if (connection.downlink) {
                    info.connection_speed = connection.downlink;
                }
            }

            return info;
        }

        // Send heartbeat to backend
        async function sendHeartbeat() {
            if (!deviceId) return;

            try {
                // Collect device information
                const deviceInfo = getDeviceInfo();

                const response = await fetch(`${API_BASE_URL}/api/devices/heartbeat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        device_id: parseInt(deviceId),
                        ...deviceInfo
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    console.log('💓 Heartbeat sent:', data.last_seen);
                    updateDebug('status', `Online - Last heartbeat: ${new Date().toLocaleTimeString()}`);
                } else {
                    console.error('Heartbeat failed:', response.status);
                }
            } catch (error) {
                console.error('❌ Heartbeat error:', error);
            }
        }

        // Start continuous heartbeat
        function startHeartbeat() {
            // Send initial heartbeat immediately
            sendHeartbeat();

            // Set up periodic heartbeat
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
            }
            heartbeatTimer = setInterval(sendHeartbeat, HEARTBEAT_INTERVAL);
            console.log('🫀 Heartbeat started (every 30 seconds)');
        }

        // Stop heartbeat
        function stopHeartbeat() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
                console.log('Heartbeat stopped');
            }
        }

        // Monitor activated
        async function onActivated() {
            console.log('Monitor activated!');
            updateDebug('status', 'Activated! Loading playlist...');

            // Save activated status to localStorage
            localStorage.setItem('monitor_status', 'active');

            stopPolling();

            // Start continuous heartbeat to maintain online status
            startHeartbeat();

            // Hide activation screen
            document.getElementById('activation-screen').style.display = 'none';

            // Show content player
            document.getElementById('content-player').classList.add('active');

            // Enter fullscreen
            enterFullscreen();

            // Load and start playlist
            await loadPlaylist();
            startPlaylist();

            // Start periodic playlist refresh to detect new content
            startPlaylistRefresh();
        }

        // Load playlist from backend
        async function loadPlaylist() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/client/playlist?device_id=${deviceId}`);

                if (!response.ok) {
                    throw new Error(`Playlist load failed: ${response.status}`);
                }

                const data = await response.json();

                // Extract playlist array from response
                playlist = data.playlist || [];

                updateDebug('playlist-count', `Playlist: ${playlist.length} items`);
                updateDebug('status', 'Syncing offline cache...');

                console.log('Playlist loaded:', playlist);

                // Sync cache with new playlist (download missing, remove unused)
                if (db) {
                    await syncCacheWithPlaylist(playlist);
                    updateDebug('status', 'Cache synced, ready to play');
                } else {
                    console.warn('⚠️  Cache not available, will stream content');
                    updateDebug('status', 'Playing content (streaming mode)');
                }

            } catch (error) {
                console.error('Playlist load error:', error);
                showError('Failed to load playlist. Retrying in 10 seconds...');
                setTimeout(loadPlaylist, 10000);
            }
        }

        // Reset to registration mode (when device deleted)
        async function resetToRegistration() {
            console.log('❌ Device deleted from server, resetting to registration mode...');

            // Exit fullscreen only if currently in fullscreen
            if (document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement) {
                exitFullscreen();
            }

            // Stop all timers
            stopPolling();
            stopHeartbeat();
            if (playlistRefreshTimer) {
                clearInterval(playlistRefreshTimer);
                playlistRefreshTimer = null;
            }
            if (contentTimer) {
                clearTimeout(contentTimer);
                contentTimer = null;
            }

            // Clear device data but keep UUID
            localStorage.removeItem('webos_device_id');
            localStorage.removeItem('webos_status');

            // Reset state variables
            deviceId = null;
            isActivated = false;
            playlist = [];
            currentIndex = 0;

            // Clear any playing content first
            const imagePlayer = document.getElementById('image-player');
            const videoPlayer = document.getElementById('video-player');
            if (videoPlayer) {
                videoPlayer.pause();
                videoPlayer.src = '';
            }
            if (imagePlayer) {
                imagePlayer.style.display = 'none';
            }
            if (videoPlayer) {
                videoPlayer.style.display = 'none';
            }

            // Reset UI - hide content player
            const contentPlayer = document.getElementById('content-player');
            if (contentPlayer) {
                contentPlayer.classList.remove('active');
                contentPlayer.style.display = 'none';
            }

            // Show activation screen with UUID
            const activationScreen = document.getElementById('activation-screen');
            if (activationScreen) {
                activationScreen.style.display = 'flex';
            }

            const uuidElement = document.getElementById('device-uuid');
            if (uuidElement) {
                uuidElement.textContent = deviceUUID;
            }

            const statusElement = document.getElementById('status-message');
            if (statusElement) {
                statusElement.textContent = '❌ Device dihapus dari server. Re-registering...';
            }

            // Small delay to ensure UI updates
            await new Promise(resolve => setTimeout(resolve, 100));

            // Re-register with same UUID
            await registerWebOSDevice();
            startPolling();
        }

        // Refresh playlist periodically to check for new content
        async function refreshPlaylist() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/client/playlist?device_id=${deviceId}`);

                if (!response.ok) {
                    // Device was deleted, reset to registration mode
                    if (response.status === 404) {
                        await resetToRegistration();
                        return;
                    }
                    console.error('Playlist refresh failed:', response.status);
                    return;
                }

                const data = await response.json();
                const newPlaylist = data.playlist || [];

                // Check if playlist changed
                if (JSON.stringify(newPlaylist) !== JSON.stringify(playlist)) {
                    console.log('✨ Playlist updated! Reloading content...');
                    console.log('Old playlist:', playlist.length, 'items');
                    console.log('New playlist:', newPlaylist.length, 'items');

                    // Save old playlist before updating (important for comparison!)
                    const oldPlaylist = playlist;

                    // Update playlist
                    playlist = newPlaylist;
                    updateDebug('playlist-count', `Playlist: ${playlist.length} items`);

                    // Sync cache with updated playlist
                    if (db) {
                        console.log('🔄 Syncing cache with updated playlist...');
                        await syncCacheWithPlaylist(playlist);
                    }

                    // If playlist is empty, stop playing
                    if (playlist.length === 0) {
                        console.log('Playlist is empty, stopping playback');
                        if (contentTimer) {
                            clearTimeout(contentTimer);
                            contentTimer = null;
                        }
                        updateDebug('status', 'No content assigned');
                        return;
                    }

                    // If currently showing content is not in new playlist, restart from beginning
                    // Use oldPlaylist to check what was previously playing
                    const currentContentId = oldPlaylist[currentIndex]?.content_id;
                    const stillExists = newPlaylist.some(item => item.content_id === currentContentId);

                    if (!stillExists) {
                        console.log('✨ Content changed, switching to new playlist...');

                        // Clear timers
                        if (contentTimer) {
                            clearTimeout(contentTimer);
                            contentTimer = null;
                        }

                        // Restart playback from beginning
                        // playContent() will handle clearing via innerHTML = ''
                        currentIndex = 0;
                        playContent(0);
                    }
                }
            } catch (error) {
                console.error('Playlist refresh error:', error);
            }
        }

        // Start periodic playlist refresh (every 10 seconds)
        function startPlaylistRefresh() {
            // Refresh playlist every 10 seconds
            playlistRefreshTimer = setInterval(() => {
                refreshPlaylist();
            }, 10000); // 10 seconds

            console.log('📡 Playlist auto-refresh started (every 10 seconds)');
        }

        // Stop playlist refresh
        function stopPlaylistRefresh() {
            if (playlistRefreshTimer) {
                clearInterval(playlistRefreshTimer);
                playlistRefreshTimer = null;
                console.log('Playlist auto-refresh stopped');
            }
        }

        // Start playing playlist
        function startPlaylist() {
            if (playlist.length === 0) {
                showError('Playlist is empty');
                return;
            }

            currentIndex = 0;
            playContent(currentIndex);
        }

        // Play specific content
        async function playContent(index) {
            // Clear any existing timer first to prevent multiple timers
            if (contentTimer) {
                clearTimeout(contentTimer);
                contentTimer = null;
            }

            if (index >= playlist.length) {
                index = 0; // Loop to start
            }

            const content = playlist[index];

            // If we're showing the same content again (single item playlist or looping)
            // and the element is already active, just reschedule
            if (currentIndex === index && currentContentElement && currentContentElement.classList.contains('active')) {
                console.log('Same content already showing, rescheduling...');

                // Schedule next content
                const duration = content.duration * 1000;
                const nextChangeTime = new Date(Date.now() + duration);
                updateDebug('next-change', `Next: ${nextChangeTime.toLocaleTimeString()}`);

                // Preload next content
                const preloadTime = Math.max(duration - PRELOAD_TIME, 0);
                setTimeout(() => preloadNextContent(index + 1), preloadTime);

                // Schedule content change
                contentTimer = setTimeout(() => playContent(index + 1), duration);
                return;
            }

            currentIndex = index;

            updateDebug('current-index', `Current: ${index + 1}/${playlist.length}`);

            console.log('Playing content:', content);

            // Try to get content from cache first (offline mode)
            let contentUrl = content.url; // Fallback to streaming URL
            let useCache = false;

            if (db) {
                try {
                    const cachedBlobUrl = await getCachedBlobUrl(content.content_id);
                    if (cachedBlobUrl) {
                        contentUrl = cachedBlobUrl;
                        useCache = true;
                        console.log(`📦 Using cached content (ID: ${content.content_id})`);
                    } else {
                        console.log(`📡 Content not cached, streaming (ID: ${content.content_id})`);
                    }
                } catch (error) {
                    console.error('Error getting cached content:', error);
                    console.log('📡 Falling back to streaming');
                }
            }

            const isVideo = content.content_type === 'video';

            console.log('Content URL:', useCache ? '[Cached Blob]' : contentUrl);

            // DIRECT REPLACEMENT PATTERN (like old viewer - no crossfade, no flicker)
            const player = document.getElementById('content-player');

            // Revoke previous blob URL to prevent memory leak
            if (currentBlobUrl && useCache) {
                URL.revokeObjectURL(currentBlobUrl);
                currentBlobUrl = null;
            }

            // Store new blob URL if using cache
            if (useCache) {
                currentBlobUrl = contentUrl;
            }

            // Clear all content first (key pattern from old viewer)
            console.log('Clearing player (direct replacement)');
            player.innerHTML = '';

            if (isVideo) {
                console.log('Creating video element');
                const element = createVideoElement(contentUrl);

                // Add directly to player
                player.appendChild(element);
                currentContentElement = element;

                // Play video
                element.play().catch(err => console.log('Video play error:', err));

                element.addEventListener('loadeddata', () => {
                    console.log('Video loaded and playing');
                }, { once: true });

            } else {
                console.log('Creating image element');
                const element = createImageElement(contentUrl);

                // Add directly to player
                player.appendChild(element);
                currentContentElement = element;

                element.addEventListener('load', () => {
                    console.log('Image loaded successfully');
                }, { once: true });
            }

            // Schedule next content
            const duration = content.duration * 1000; // Convert to milliseconds
            const nextChangeTime = new Date(Date.now() + duration);
            updateDebug('next-change', `Next: ${nextChangeTime.toLocaleTimeString()}`);

            // Preload next content
            const preloadTime = Math.max(duration - PRELOAD_TIME, 0);
            setTimeout(() => preloadNextContent(index + 1), preloadTime);

            // Schedule content change
            contentTimer = setTimeout(() => playContent(index + 1), duration);
        }

        // Create image element
        function createImageElement(url) {
            const img = document.createElement('img');
            img.src = url;
            img.className = 'content-item';
            return img;
        }

        // Create video element
        function createVideoElement(url) {
            const video = document.createElement('video');
            video.src = url;
            video.className = 'content-item';
            video.autoplay = true;
            video.muted = true; // Muted autoplay for browser compatibility
            return video;
        }

        // Preload next content
        function preloadNextContent(index) {
            if (index >= playlist.length) {
                index = 0;
            }

            const content = playlist[index];
            const contentUrl = content.url; // Use URL from playlist
            const isVideo = content.content_type === 'video';
            
            // Preload in background
            if (isVideo) {
                const video = document.createElement('video');
                video.src = contentUrl;
                video.preload = 'auto';
                nextContentElement = video;
            } else {
                const img = new Image();
                img.src = contentUrl;
                nextContentElement = img;
            }
            
            console.log('Preloaded next content:', content);
        }

        // Enter fullscreen
        function enterFullscreen() {
            const elem = document.documentElement;

            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }

        // Toggle fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                enterFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.add('visible');
            
            setTimeout(() => {
                errorDiv.classList.remove('visible');
            }, 5000);
        }

        // Update debug info
        function updateDebug(field, value) {
            const element = document.getElementById(`debug-${field}`);
            if (element) {
                element.textContent = value;
            }
        }

        // Toggle debug mode
        function toggleDebug() {
            debugMode = !debugMode;
            const debugInfo = document.getElementById('debug-info');
            
            if (debugMode) {
                debugInfo.classList.add('visible');
            } else {
                debugInfo.classList.remove('visible');
            }
        }

        // Reset device (clear localStorage and reload)
        function resetMonitor() {
            if (confirm('Reset device? This will clear saved data but keep the same UUID.')) {
                localStorage.removeItem('webos_device_id');
                localStorage.removeItem('webos_status');
                // Keep device_uuid - permanent identifier
                location.reload();
            }
        }

        // Setup keyboard shortcuts
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                switch(e.key.toLowerCase()) {
                    case 'd':
                        toggleDebug();
                        break;
                    case 'f':
                        toggleFullscreen();
                        break;
                    case 'n':
                        if (isActivated && playlist.length > 0) {
                            clearTimeout(contentTimer);
                            playContent(currentIndex + 1);
                        }
                        break;
                    case 'r':
                        if (isActivated) {
                            loadPlaylist().then(() => {
                                clearTimeout(contentTimer);
                                startPlaylist();
                            });
                        }
                        break;
                    case 'x':
                        // Reset monitor (only if NOT activated yet)
                        if (!isActivated) {
                            resetMonitor();
                        }
                        break;
                }
            });
        }

        // Start application
        init();
    </script>
</body>
</html>
