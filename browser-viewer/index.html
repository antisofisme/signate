<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart TV Monitor Viewer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Activation Screen -->
    <div id="activation-screen">
        <h1>Smart TV Monitor</h1>
        <div id="activation-code">------</div>
        <p>⏳ Menunggu persetujuan dari server...</p>
        <div class="spinner"></div>
        <p style="margin-top: 2rem; font-size: 0.9rem; opacity: 0.7;">Press 'x' to reset and get a new code</p>
    </div>

    <!-- Content Player -->
    <div id="content-player"></div>

    <!-- Debug Info -->
    <div id="debug-info">
        <div><strong>Debug Info</strong></div>
        <div id="debug-device-id">Device ID: -</div>
        <div id="debug-status">Status: Initializing</div>
        <div id="debug-playlist-count">Playlist: 0 items</div>
        <div id="debug-current-index">Current: -</div>
        <div id="debug-next-change">Next change: -</div>
        <div><small>Keys: d=toggle, f=fullscreen, n=next, r=reload, x=reset</small></div>
    </div>

    <!-- Error Message -->
    <div id="error-message" class="error-message"></div>

    <!-- Load and initialize application -->
    <script type="module">
        import { init } from './js/app.js';

        // Initialize the application when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
