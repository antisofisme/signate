<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Signage Viewer - Shell</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            overflow: hidden;
        }

        /* Activation Screen (shown until approved) */
        #activation-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .activation-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        #activation-code {
            font-size: 5rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            padding: 1.5rem 3rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            margin: 2rem 0;
            letter-spacing: 0.3rem;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #status-message {
            font-size: 1.5rem;
            margin: 1.5rem 0;
        }

        /* Player Container (hidden until activated) */
        #player-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
        }

        #player-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #error-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.2rem;
            display: none;
        }

        /* Shell Info (debug) */
        #shell-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 9999;
            display: none; /* Hide by default, show with keyboard shortcut */
        }

        /* Enter Fullscreen Button */
        #enter-fullscreen-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease, background 0.2s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            pointer-events: auto;
        }

        /* Button hover effect */
        #enter-fullscreen-btn:hover {
            background: rgba(0, 100, 255, 0.8);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        /* Show button class (triggered by JS) */
        #enter-fullscreen-btn.show {
            opacity: 1;
        }

        /* Exit Fullscreen Button */
        #exit-fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease, background 0.2s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            pointer-events: auto;
        }

        /* Button hover effect */
        #exit-fullscreen-btn:hover {
            background: rgba(255, 0, 0, 0.8);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        /* Show button class (triggered by JS) */
        #exit-fullscreen-btn.show {
            opacity: 1;
        }

        /* Hide buttons based on fullscreen state (toggled by JS) */
        body.is-fullscreen #enter-fullscreen-btn {
            display: none;
        }

        body:not(.is-fullscreen) #exit-fullscreen-btn {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Activation Screen (pending approval) -->
    <div id="activation-screen">
        <div class="activation-card">
            <h1>📺 Digital Signage</h1>

            <div id="activation-code">------</div>

            <div class="spinner"></div>

            <p id="status-message">⏳ Initializing...</p>

            <p style="margin-top: 1.5rem; font-size: 1rem; opacity: 0.8;">
                Admin will approve this device in the Web Admin panel
            </p>
        </div>
    </div>

    <!-- Player Container (iframe) -->
    <div id="player-container">
        <iframe id="player-iframe" allow="autoplay"></iframe>
        <div id="error-message"></div>
    </div>

    <!-- Enter Fullscreen Button (hover to show) - OUTSIDE player container -->
    <button id="enter-fullscreen-btn" title="Enter Fullscreen (F)">
        ⛶
    </button>

    <!-- Exit Fullscreen Button (hover to show) - OUTSIDE player container -->
    <button id="exit-fullscreen-btn" title="Exit Fullscreen (Esc)">
        ✕
    </button>

    <!-- Shell Info (debug - press 's' to toggle) -->
    <div id="shell-info">
        <strong>SHELL STATUS</strong><br>
        Device ID: <span id="debug-device-id">-</span><br>
        Status: <span id="debug-status">-</span><br>
        Logger: <span id="debug-logger">Active ✅</span><br>
        Heartbeat: <span id="debug-heartbeat">-</span>
    </div>

    <!-- Shell Modules (STABLE CORE) - Load in correct order -->
    <script src="js/shell/config.js?v=20251024-6"></script>
    <script src="js/shell/logger.js?v=20251024-6"></script>
    <script src="js/shell/registration.js?v=20251024-6"></script>
    <script src="js/shell/heartbeat.js?v=20251024-6"></script>
    <script src="js/shell/display-settings.js?v=20251024-6"></script>
    <script src="js/shell/ui.js?v=20251024-6"></script>
    <script src="js/shell/init.js?v=20251024-6"></script>

    <!-- Keyboard Shortcuts & Fullscreen Management -->
    <script>
        let hideButtonTimer = null;

        // Track fullscreen state
        function updateFullscreenState() {
            const playerContainer = document.getElementById('player-container');
            const exitBtn = document.getElementById('exit-fullscreen-btn');
            const enterBtn = document.getElementById('enter-fullscreen-btn');

            const isFullscreen = !!document.fullscreenElement;
            console.log('[Shell] Fullscreen state changed:', isFullscreen);

            if (isFullscreen) {
                console.log('[Shell] Entering fullscreen mode');
                playerContainer.classList.add('fullscreen');
                document.body.classList.add('is-fullscreen');
                // Show exit button initially for 3 seconds
                showExitButton();
                // Hide enter button
                if (enterBtn) enterBtn.classList.remove('show');

                // Wait for browser to finish fullscreen transition, then update
                setTimeout(() => {
                    // Recalculate rotation with new viewport dimensions
                    console.log('[Shell] Recalculating rotation for fullscreen viewport...');
                    if (window.ShellDisplaySettings && window.ShellDisplaySettings.applyRotation) {
                        window.ShellDisplaySettings.applyRotation();
                    }

                    // Reload player to update viewport size
                    console.log('[Shell] Reloading player for new viewport size...');
                    if (window.ShellUI && window.ShellUI.loadPlayer) {
                        window.ShellUI.loadPlayer();
                    }
                }, 100); // Small delay for browser to complete fullscreen
            } else {
                console.log('[Shell] Exiting fullscreen mode');
                playerContainer.classList.remove('fullscreen');
                document.body.classList.remove('is-fullscreen');
                // Hide exit button
                if (exitBtn) exitBtn.classList.remove('show');

                // Wait for browser to finish fullscreen exit, then update
                setTimeout(() => {
                    // Recalculate rotation with normal viewport dimensions
                    console.log('[Shell] Recalculating rotation for normal viewport...');
                    if (window.ShellDisplaySettings && window.ShellDisplaySettings.applyRotation) {
                        window.ShellDisplaySettings.applyRotation();
                    }

                    // Reload player to restore normal viewport size
                    console.log('[Shell] Reloading player for normal viewport size...');
                    if (window.ShellUI && window.ShellUI.loadPlayer) {
                        window.ShellUI.loadPlayer();
                    }
                }, 100); // Small delay for browser to complete fullscreen exit
            }
        }

        // Show exit button and auto-hide after 3 seconds
        function showExitButton() {
            const exitBtn = document.getElementById('exit-fullscreen-btn');
            exitBtn.classList.add('show');

            // Clear existing timer
            if (hideButtonTimer) {
                clearTimeout(hideButtonTimer);
            }

            // Auto-hide after 3 seconds
            hideButtonTimer = setTimeout(() => {
                exitBtn.classList.remove('show');
            }, 3000);
        }

        // Show enter button and auto-hide after 3 seconds
        function showEnterButton() {
            const enterBtn = document.getElementById('enter-fullscreen-btn');
            enterBtn.classList.add('show');

            // Clear existing timer
            if (hideButtonTimer) {
                clearTimeout(hideButtonTimer);
            }

            // Auto-hide after 3 seconds
            hideButtonTimer = setTimeout(() => {
                enterBtn.classList.remove('show');
            }, 3000);
        }

        // Track mouse movement to show appropriate button
        document.addEventListener('mousemove', (e) => {
            if (document.fullscreenElement) {
                // In fullscreen - show exit button
                showExitButton();
            } else {
                // Not in fullscreen - show enter button
                showEnterButton();
            }
        });

        // Listen for fullscreen changes
        document.addEventListener('fullscreenchange', updateFullscreenState);
        document.addEventListener('webkitfullscreenchange', updateFullscreenState);
        document.addEventListener('mozfullscreenchange', updateFullscreenState);
        document.addEventListener('MSFullscreenChange', updateFullscreenState);

        // Enter fullscreen button click
        const enterBtn = document.getElementById('enter-fullscreen-btn');
        if (enterBtn) {
            enterBtn.addEventListener('click', () => {
                console.log('[Shell] Enter button clicked');
                if (!document.fullscreenElement) {
                    console.log('[Shell] Entering fullscreen via button...');
                    const elem = document.documentElement;
                    const requestFullscreen = elem.requestFullscreen ||
                                             elem.webkitRequestFullscreen ||
                                             elem.mozRequestFullScreen ||
                                             elem.msRequestFullscreen;

                    if (requestFullscreen) {
                        requestFullscreen.call(elem).then(() => {
                            console.log('[Shell] ✅ Fullscreen entered successfully');
                        }).catch(err => {
                            console.error('[Shell] ❌ Fullscreen error:', err);
                        });
                    }
                } else {
                    console.log('[Shell] Already in fullscreen');
                }
            });
            console.log('[Shell] Enter button listener attached');
        } else {
            console.error('[Shell] Enter button not found!');
        }

        // Exit fullscreen button click
        const exitBtn = document.getElementById('exit-fullscreen-btn');
        if (exitBtn) {
            exitBtn.addEventListener('click', () => {
                console.log('[Shell] Exit button clicked');
                if (document.fullscreenElement) {
                    console.log('[Shell] Exiting fullscreen via button...');
                    document.exitFullscreen();
                } else {
                    console.log('[Shell] Already not in fullscreen');
                }
            });
            console.log('[Shell] Exit button listener attached');
        } else {
            console.error('[Shell] Exit button not found!');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Press 's' to toggle shell debug info
            if (e.key === 's' || e.key === 'S') {
                const info = document.getElementById('shell-info');
                info.style.display = info.style.display === 'none' ? 'block' : 'none';

                // Update debug info
                document.getElementById('debug-device-id').textContent = localStorage.getItem('device_id') || '-';
                document.getElementById('debug-status').textContent = localStorage.getItem('device_status') || '-';
            }

            // Press 'r' to reload player only (not shell)
            if (e.key === 'r' || e.key === 'R') {
                if (window.reloadPlayer) {
                    window.reloadPlayer();
                }
            }

            // Press 'c' to clear localStorage and reset device
            if (e.key === 'c' || e.key === 'C') {
                if (confirm('Clear device registration and reset?')) {
                    localStorage.clear();
                    location.reload();
                }
            }

            // Press 'f' to toggle fullscreen
            if (e.key === 'f' || e.key === 'F') {
                console.log('[Shell] F key pressed, current fullscreen state:', !!document.fullscreenElement);

                if (!document.fullscreenElement) {
                    // Enter fullscreen
                    console.log('[Shell] Attempting to enter fullscreen...');

                    const elem = document.documentElement;
                    const requestFullscreen = elem.requestFullscreen ||
                                             elem.webkitRequestFullscreen ||
                                             elem.mozRequestFullScreen ||
                                             elem.msRequestFullscreen;

                    if (requestFullscreen) {
                        requestFullscreen.call(elem).then(() => {
                            console.log('[Shell] ✅ Fullscreen entered successfully');
                        }).catch(err => {
                            console.error('[Shell] ❌ Fullscreen error:', err);
                            alert('Fullscreen failed: ' + err.message);
                        });
                    } else {
                        console.error('[Shell] ❌ Fullscreen API not supported');
                        alert('Fullscreen not supported in this browser');
                    }
                } else {
                    // Exit fullscreen
                    console.log('[Shell] Exiting fullscreen...');
                    document.exitFullscreen();
                }
            }

            // Press 'Esc' to exit fullscreen
            if (e.key === 'Escape' && document.fullscreenElement) {
                document.exitFullscreen();
            }
        });

        // Initial state
        updateFullscreenState();
    </script>
</body>
</html>
