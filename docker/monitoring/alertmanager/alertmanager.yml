global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  
  routes:
    - match:
        severity: critical
      receiver: critical
      
    - match:
        severity: warning
      receiver: warning

receivers:
  - name: 'default'
    # Default receiver - can add email, webhook, etc.
    
  - name: 'critical'
    # Critical alerts receiver
    # email_configs:
    #   - to: 'admin@example.com'
    #     from: 'alerts@signage.local'
    #     smarthost: 'smtp.gmail.com:587'
    #     auth_username: 'alerts@signage.local'
    #     auth_password: 'password'
    
  - name: 'warning'
    # Warning alerts receiver

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']