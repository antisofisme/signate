global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['signage-postgres-exporter:9187']

  # Backend API metrics
  - job_name: 'backend'
    static_configs:
      - targets: ['signage-backend-python:8000']
    metrics_path: '/metrics'

  # Redis metrics (if exporter added)
  - job_name: 'redis'
    static_configs:
      - targets: ['signage-redis:6379']