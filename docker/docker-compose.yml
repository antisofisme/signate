services:
  postgres:
    container_name: signage-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: signage_db
      POSTGRES_USER: signage_user
      POSTGRES_PASSWORD: signage_pass_prod_2025
    ports:
    - 5433:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    networks:
    - signage-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signage_user -d signage_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: signage-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
    - 6379:6379
    volumes:
    - redis-data:/data
    networks:
    - signage-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  clamav:
    container_name: signage-clamav
    image: clamav/clamav:latest
    restart: unless-stopped
    ports:
    - 3310:3310
    volumes:
    - clamav-data:/var/lib/clamav
    networks:
    - signage-network

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: signage-pgbouncer
    restart: unless-stopped
    ports:
    - 6432:6432
    environment:
      DATABASES_HOST: 172.18.0.4
      DATABASES_PORT: 5432
      DATABASES_USER: signage_user
      DATABASES_PASSWORD: signage_pass_prod_2025
      DATABASES_DBNAME: signage_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      SERVER_IDLE_TIMEOUT: 600
      AUTH_TYPE: md5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - signage-network

  backend-api:
    container_name: signage-backend-python
    build:
      context: ../backend-python
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
    - 8001:8000
    environment:
      DATABASE_URL: postgresql://signage_user:signage_pass_prod_2025@signage-pgbouncer:6432/signage_db
      REDIS_URL: redis://signage-redis:6379/0
      CLAMAV_HOST: signage-clamav
      CLAMAV_PORT: 3310
      SECRET_KEY: d5a744c062e254050dbc9405dc654f51b436ac5539b5e6b8997f86b56749c266
      JWT_SECRET: 07bc4fd46bc638bee245d1e777b9c80234e39a58f66a04c7a7ab8832083122f6
      ENCRYPTION_KEY: e779d259bfea9822d0fe994903dac28f
      CORS_ORIGINS: https://admin.zhmhotels.online,https://player.zhmhotels.online,https://api.zhmhotels.online,wss://api.zhmhotels.online
      ENVIRONMENT: production
      DEBUG: false
      LOG_LEVEL: info
    volumes:
    - ../backend-python:/app
    - content-data:/data/signage/content
    networks:
    - signage-network
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/health', timeout=5.0)\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  celery-worker:
    container_name: signage-celery-worker
    build:
      context: ../backend-python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info -Q celery,video_processing,image_processing
    environment:
      DATABASE_URL: postgresql://signage_user:signage_pass_prod_2025@signage-pgbouncer:6432/signage_db
      REDIS_URL: redis://signage-redis:6379/0
      SECRET_KEY: d5a744c062e254050dbc9405dc654f51b436ac5539b5e6b8997f86b56749c266
      JWT_SECRET: 07bc4fd46bc638bee245d1e777b9c80234e39a58f66a04c7a7ab8832083122f6
      ENCRYPTION_KEY: e779d259bfea9822d0fe994903dac28f
      ENVIRONMENT: production
      DEBUG: false
      LOG_LEVEL: info
    volumes:
    - ../backend-python:/app
    - content-data:/data/signage/content
    networks:
    - signage-network
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -t 10 || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

  cms-frontend:
    container_name: signage-cms
    image: nginx:alpine
    restart: unless-stopped
    ports:
    - 3000:80
    volumes:
    - ../cms-vite/dist:/usr/share/nginx/html:ro
    - ../cms-vite/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
    - signage-network
    depends_on:
    - backend-api

  player:
    container_name: signage-player
    image: nginx:alpine
    restart: unless-stopped
    ports:
    - 8080:80
    volumes:
    - ../player-vite/dist:/usr/share/nginx/html:ro
    - ../player-vite/nginx-full.conf:/etc/nginx/nginx.conf:ro
    networks:
    - signage-network

networks:
  signage-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  content-data:
  clamav-data:
