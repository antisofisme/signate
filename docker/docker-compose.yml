version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    container_name: signage-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: signage_db
      POSTGRES_USER: signage_user
      POSTGRES_PASSWORD: signage_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../backend-python/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - signage-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signage_user -d signage_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    container_name: signage-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - signage-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================
  # Backend API (FastAPI)
  # ============================================
  backend-api:
    container_name: signage-backend-python
    build:
      context: ../backend-python
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://signage_user:signage_pass@postgres:5432/signage_db

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Security
      SECRET_KEY: your-secret-key-change-in-production
      JWT_SECRET: your-jwt-secret-change-in-production
      ENCRYPTION_KEY: your-encryption-key-32-chars-long

      # CORS - Allow frontend origins
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://192.168.5.12:8080,http://192.168.5.12:3000

      # App settings
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: info
    volumes:
      - ../backend-python:/app
      - content-data:/data/signage/content
    networks:
      - signage-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/health', timeout=5.0)\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ============================================
  # Celery Worker (Background Tasks)
  # ============================================
  celery-worker:
    container_name: signage-celery-worker
    build:
      context: ../backend-python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info -Q celery,video_processing,image_processing
    environment:
      # Database
      DATABASE_URL: postgresql://signage_user:signage_pass@postgres:5432/signage_db

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Security
      SECRET_KEY: your-secret-key-change-in-production
      JWT_SECRET: your-jwt-secret-change-in-production
      ENCRYPTION_KEY: your-encryption-key-32-chars-long

      # App settings
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: info
    volumes:
      - ../backend-python:/app
      - content-data:/data/signage/content
    networks:
      - signage-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  signage-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  content-data:
