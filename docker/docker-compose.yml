version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    container_name: signage-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: signage_db
      POSTGRES_USER: signage_user
      POSTGRES_PASSWORD: signage_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../backend-python/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - signage-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signage_user -d signage_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    container_name: signage-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - signage-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================
  # PgBouncer Connection Pooler
  # ============================================
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: signage-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    command: ["/opt/pgbouncer/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - signage-network

  # ============================================
  # Backend API (FastAPI)
  # ============================================
  backend-api:
    container_name: signage-backend-python
    build:
      context: ../backend-python
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://signage_user:signage_pass@postgres:5432/signage_db

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Security
      SECRET_KEY: your-secret-key-change-in-production
      JWT_SECRET: your-jwt-secret-change-in-production
      ENCRYPTION_KEY: your-encryption-key-32-chars-long

      # CORS - Allow frontend origins
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://192.168.5.12:8080,http://192.168.5.12:3000

      # App settings
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: info
    volumes:
      - ../backend-python:/app
      - content-data:/data/signage/content
    networks:
      - signage-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/health', timeout=5.0)\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ============================================
  # Celery Worker (Background Tasks)
  # ============================================
  celery-worker:
    container_name: signage-celery-worker
    build:
      context: ../backend-python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info -Q celery,video_processing,image_processing
    environment:
      # Database
      DATABASE_URL: postgresql://signage_user:signage_pass@postgres:5432/signage_db

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Security
      SECRET_KEY: your-secret-key-change-in-production
      JWT_SECRET: your-jwt-secret-change-in-production
      ENCRYPTION_KEY: your-encryption-key-32-chars-long

      # App settings
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: info
    volumes:
      - ../backend-python:/app
      - content-data:/data/signage/content
    networks:
      - signage-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================
  # CMS Frontend (React Vite Static Build)
  # ============================================
  cms-frontend:
    container_name: signage-cms
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ../cms-vite/dist:/usr/share/nginx/html:ro
      - ../cms-vite/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - signage-network
    depends_on:
      - backend-api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================
  # Player (Vite - TypeScript)
  # ============================================
  player:
    container_name: signage-player
    build:
      context: ../player-vite
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - signage-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================
  # Monitoring - Prometheus
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: signage-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"  # Use 9091 since 9090 is taken by Portainer
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - signage-network

  # ============================================
  # Monitoring - Grafana
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: signage-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - signage-network

  # ============================================
  # PostgreSQL Exporter for Prometheus
  # ============================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: signage-postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://signage_user:signage_pass@postgres:5432/signage_db?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - signage-network

networks:
  signage-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  content-data:
  prometheus-data:
  grafana-data:
