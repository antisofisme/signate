;; ============================================================================
;; PgBouncer Configuration for Signage System
;; ============================================================================
;; This file configures PgBouncer connection pooling for PostgreSQL
;; Place this file in docker/ folder and mount to container
;; ============================================================================

[databases]
;; Database connections
;; Format: dbname = host=hostname port=port dbname=database
signage_db = host=signage-postgres port=5432 dbname=signage_db

[pgbouncer]
;; ============================================================================
;; POOL SETTINGS
;; ============================================================================

;; Pool mode (most important setting!)
;; - session: Client gets dedicated connection (like direct PostgreSQL)
;; - transaction: Connection returned after each transaction (RECOMMENDED)
;; - statement: Connection returned after each statement (breaks transactions)
pool_mode = transaction

;; Maximum number of client connections
;; This is connections FROM your application TO pgbouncer
max_client_conn = 1000

;; Default number of connections PER DATABASE
;; This is connections FROM pgbouncer TO postgresql
;; 25 connections can handle 1000+ concurrent requests!
default_pool_size = 25

;; Minimum pool size (keep connections ready)
min_pool_size = 10

;; Reserve pool (extra connections for load spikes)
reserve_pool_size = 5

;; Maximum connections per user
max_user_connections = 50

;; Maximum connections per database
max_db_connections = 100

;; ============================================================================
;; TIMEOUTS (all in seconds)
;; ============================================================================

;; How long clients can wait in queue for a connection
;; If all 25 pool connections are busy, queue for max 2 minutes
query_wait_timeout = 120

;; Close server (PostgreSQL) connection if idle for 10 minutes
server_idle_timeout = 600

;; Timeout for connecting to PostgreSQL
server_connect_timeout = 15

;; How long to wait before retrying failed login
server_login_retry = 15

;; Close server connection after 1 hour (prevents long-lived connections)
server_lifetime = 3600

;; How long client can be idle (0 = disabled)
client_idle_timeout = 0

;; Query sent to server on connection release
;; DISCARD ALL resets session state (temp tables, prepared statements, etc)
server_reset_query = DISCARD ALL

;; ============================================================================
;; LOGGING
;; ============================================================================

;; Log every connection (useful for debugging)
log_connections = 1

;; Log every disconnection
log_disconnections = 1

;; Log pooler errors
log_pooler_errors = 1

;; Verbose logging (0 = disabled, 1 = enabled)
;; Enable for debugging, disable in production
verbose = 0

;; ============================================================================
;; ADMIN ACCESS
;; ============================================================================

;; Users allowed to use admin console (SHOW POOLS, SHOW STATS, etc)
admin_users = signage_admin

;; Users allowed to view statistics (read-only admin)
stats_users = signage_stats, signage_user

;; ============================================================================
;; NETWORK SETTINGS
;; ============================================================================

;; Listen on all interfaces
listen_addr = 0.0.0.0

;; PgBouncer port (NOT 5432!)
;; Application connects to 6432, PgBouncer connects to PostgreSQL:5432
listen_port = 6432

;; Unix socket (optional, for local connections)
;unix_socket_dir = /tmp

;; ============================================================================
;; AUTHENTICATION
;; ============================================================================

;; Authentication type
;; - md5: Password hashing (RECOMMENDED)
;; - scram-sha-256: More secure (PostgreSQL 10+)
;; - plain: Passwords in plain text (NOT RECOMMENDED)
auth_type = md5

;; File containing user credentials
;; Format: "username" "md5<hash>" or "username" "password"
auth_file = /etc/pgbouncer/userlist.txt

;; Query to fetch user password from database (alternative to auth_file)
;; auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

;; ============================================================================
;; PERFORMANCE TUNING
;; ============================================================================

;; Ignore certain startup parameters (prevents connection errors)
;; Some clients send extra parameters PostgreSQL doesn't recognize
ignore_startup_parameters = extra_float_digits,options

;; Disable DNS lookups for client hostnames (faster)
;; Set to 1 if you need hostnames in logs
disable_pqexec = 0

;; TCP keepalive settings (detect dead connections)
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 60
tcp_keepintvl = 10

;; ============================================================================
;; SECURITY
;; ============================================================================

;; Allowed client hosts (0.0.0.0/0 = all, for Docker network)
;; In production, restrict to application IP only
;; Example: 172.18.0.0/16 for Docker network
;server_tls_sslmode = prefer

;; ============================================================================
;; SPECIAL SETTINGS
;; ============================================================================

;; Application name sent to PostgreSQL
;application_name_add_host = 1

;; Maximum prepared statements per pool connection
;max_prepared_statements = 100

;; ============================================================================
;; END OF CONFIGURATION
;; ============================================================================
