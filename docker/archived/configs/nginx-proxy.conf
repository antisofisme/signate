# Nginx Reverse Proxy for Smart TV Digital Signage
# Handles SSL termination and routing to containers
# Generated: 2025-11-24

# Upstream definitions
upstream backend_api {
    server backend-api:8000;
}

upstream cms_frontend {
    server cms-frontend:80;
}

upstream player {
    server player:80;
}

# =============================================================================
# API Backend (api.zhmhotels.online)
# =============================================================================
server {
    listen 443 ssl http2;
    server_name api.zhmhotels.online;

    ssl_certificate /etc/nginx/ssl/zhmhotels.crt;
    ssl_certificate_key /etc/nginx/ssl/zhmhotels.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Max upload size (for content uploads)
    client_max_body_size 500M;
    client_body_timeout 300s;

    # API routes
    location / {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # WebSocket support for /ws
    location /ws {
        proxy_pass http://backend_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Static content (uploads, HLS streams)
    location /content/ {
        proxy_pass http://backend_api/content/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Thumbnails
    location /thumbnails/ {
        proxy_pass http://backend_api/thumbnails/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =============================================================================
# CMS Admin (admin.zhmhotels.online)
# =============================================================================
server {
    listen 443 ssl http2;
    server_name admin.zhmhotels.online;

    ssl_certificate /etc/nginx/ssl/zhmhotels.crt;
    ssl_certificate_key /etc/nginx/ssl/zhmhotels.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://cms_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing - fallback to index.html
    location ~ ^/.+$ {
        proxy_pass http://cms_frontend;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}

# =============================================================================
# Player (player.zhmhotels.online)
# =============================================================================
server {
    listen 443 ssl http2;
    server_name player.zhmhotels.online;

    ssl_certificate /etc/nginx/ssl/zhmhotels.crt;
    ssl_certificate_key /etc/nginx/ssl/zhmhotels.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://player;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing - fallback to index.html
    location ~ ^/.+$ {
        proxy_pass http://player;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}

# =============================================================================
# HTTP to HTTPS Redirect
# =============================================================================
server {
    listen 80;
    server_name api.zhmhotels.online admin.zhmhotels.online player.zhmhotels.online;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}
