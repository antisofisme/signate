version: '3.8'
services:
  postgres:
    container_name: signage-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: signage_db
      POSTGRES_USER: signage_user
      POSTGRES_PASSWORD: signage_pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
    - 5433:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ../backend-python/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
    - signage-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U signage_user -d signage_db
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: json-file
      options: &id001
        max-size: 10m
        max-file: '5'
        labels: production
  redis:
    container_name: signage-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
    - 6379:6379
    volumes:
    - redis-data:/data
    networks:
    - signage-network
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: json-file
      options: *id001
  clamav:
    container_name: signage-clamav
    image: clamav/clamav:latest
    restart: unless-stopped
    ports:
    - 3310:3310
    volumes:
    - clamav-data:/var/lib/clamav
    networks:
    - signage-network
    healthcheck:
      test:
      - CMD
      - /usr/bin/clamdscan
      - --version
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: json-file
      options: *id001
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: signage-pgbouncer
    restart: unless-stopped
    ports:
    - 6432:6432
    environment:
      DATABASES_HOST: ${POSTGRES_HOST}
      DATABASES_PORT: ${POSTGRES_PORT}
      DATABASES_USER: ${POSTGRES_USER}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASES_DBNAME: ${POSTGRES_DB}
      POOL_MODE: ${PGBOUNCER_POOL_MODE}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE}
      SERVER_IDLE_TIMEOUT: ${PGBOUNCER_SERVER_IDLE_TIMEOUT}
      AUTH_TYPE: ${PGBOUNCER_AUTH_TYPE}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - signage-network
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -h
      - localhost
      - -p
      - '6432'
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: json-file
      options: *id001
  backend-api:
    container_name: signage-backend-python
    build:
      context: ../backend-python
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
    - 8001:8000
    environment:
      DATABASE_URL: postgresql://signage_user:signage_pass@postgres:5432/signage_db
      REDIS_URL: redis://redis:6379/0
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SECRET_KEY: your-secret-key-change-in-production
      JWT_SECRET: your-jwt-secret-change-in-production
      ENCRYPTION_KEY: your-encryption-key-32-chars-long
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://192.168.5.12:8080,http://192.168.5.12:3000,https://admin.zhmhotels.online,https://player.zhmhotels.online,https://api.zhmhotels.online,wss://api.zhmhotels.online
      ENVIRONMENT: production
      DEBUG: 'false'
      LOG_LEVEL: info
    volumes:
    - ../backend-python:/app
    - content-data:/data/signage/content
    networks:
    - signage-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import httpx; httpx.get('http://localhost:8000/health', timeout=5.0)" || exit 1
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options: *id001
  celery-worker:
    container_name: signage-celery-worker
    build:
      context: ../backend-python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info -Q celery,video_processing,image_processing
    environment:
      DATABASE_URL: postgresql://signage_user:signage_pass@postgres:5432/signage_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key-change-in-production
      JWT_SECRET: your-jwt-secret-change-in-production
      ENCRYPTION_KEY: your-encryption-key-32-chars-long
      ENVIRONMENT: production
      DEBUG: 'false'
      LOG_LEVEL: info
    volumes:
    - ../backend-python:/app
    - content-data:/data/signage/content
    networks:
    - signage-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - celery -A celery_app inspect ping -d celery@$${HOSTNAME} || exit 1
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '4.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: json-file
      options: *id001
  cms-frontend:
    container_name: signage-cms
    image: nginx:alpine
    restart: unless-stopped
    ports:
    - 3000:80
    volumes:
    - ../cms-vite/dist:/usr/share/nginx/html:ro
    - ../cms-vite/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
    - signage-network
    depends_on:
    - backend-api
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options: *id001
  player:
    container_name: signage-player
    build:
      context: ../player-vite
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
    - 8080:80
    networks:
    - signage-network
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options: *id001
networks:
  signage-network:
    driver: bridge
volumes:
  postgres-data: null
  redis-data: null
  clamav-data: null
  content-data: null
