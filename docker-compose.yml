version: '3.8'

# =============================================================================
# SMART TV DIGITAL SIGNAGE - DOCKER COMPOSE
# =============================================================================
# Development setup untuk Backend API, PostgreSQL, Redis
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose down           # Stop all services
#   docker-compose logs -f        # View logs
#   docker-compose ps             # Check status
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: signage-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"  # Changed to 5433 to avoid conflict
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signage_password}
      POSTGRES_DB: ${POSTGRES_DB:-signage_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Persistent data
      - postgres-data:/var/lib/postgresql/data
      # Auto-run init.sql on first start
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signage_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signage-network

  # ===========================================================================
  # Redis (Cache & Session)
  # ===========================================================================
  # SKIP: Redis sudah ada di server (dari Anthias)
  # Pakai: redis://192.168.5.12:6379
  # redis:
  #   image: redis:7-alpine
  #   container_name: signage-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - redis-data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - signage-network

  # ===========================================================================
  # Backend API (FastAPI)
  # ===========================================================================
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signage-backend
    restart: unless-stopped
    ports:
      - "8001:8000"  # Port 8001 external (Anthias uses 8000)
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-signage_user}:${POSTGRES_PASSWORD:-signage_password}@postgres:5432/${POSTGRES_DB:-signage_db}
      - REDIS_URL=redis://192.168.5.12:6379  # Use existing Redis from Anthias
      - ANTHIAS_API_URL=${ANTHIAS_API_URL:-http://192.168.5.12:8000}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app  # Mount app folder for hot reload
    networks:
      - signage-network

  # ===========================================================================
  # pgAdmin (Optional - Database Management UI)
  # ===========================================================================
  # Uncomment jika mau GUI untuk manage PostgreSQL
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: signage-pgadmin
  #   restart: unless-stopped
  #   ports:
  #     - "5050:80"
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@signage.local
  #     PGADMIN_DEFAULT_PASSWORD: admin123
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin
  #   depends_on:
  #     - postgres
  #   networks:
  #     - signage-network

# =============================================================================
# Networks
# =============================================================================
networks:
  signage-network:
    driver: bridge

# =============================================================================
# Volumes (Persistent Data)
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  # pgadmin-data:
  #   driver: local
