version: '3.8'

# =============================================================================
# SMART TV DIGITAL SIGNAGE - UNIFIED DOCKER COMPOSE
# =============================================================================
# Complete setup: PostgreSQL + Backend API + Anthias (all-in-one)
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose down           # Stop all services
#   docker-compose logs -f        # View logs
#   docker-compose ps             # Check status
#   docker-compose build --no-cache  # Rebuild from scratch
#
# Rebuild strategy:
#   1. docker-compose down --volumes --remove-orphans
#   2. docker-compose build --no-cache
#   3. docker-compose up -d
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database (for Backend API)
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: signage-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-signage_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signage_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signage-network

  # ===========================================================================
  # Redis (Shared by Backend and Anthias)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: signage-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signage-network

  # ===========================================================================
  # Backend API (FastAPI)
  # ===========================================================================
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signage-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-signage_user}:${POSTGRES_PASSWORD:-your_password_here}@postgres:5432/${POSTGRES_DB:-signage_db}
      - REDIS_URL=redis://redis:6379
      - ANTHIAS_API_URL=http://192.168.5.12:8000
      - API_BASE_URL=http://192.168.5.12:8001
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:3001","http://192.168.5.12:8080","http://192.168.5.12:8081"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    networks:
      - signage-network

  # ===========================================================================
  # Anthias Server (Digital Signage CMS)
  # ===========================================================================
  anthias-server:
    build:
      context: ./anthias
      dockerfile: docker/Dockerfile.server
    container_name: anthias-server
    restart: unless-stopped
    environment:
      - HOME=/data
      - LISTEN=0.0.0.0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - anthias-data:/data
      - ./anthias-assets:/data/screenly_assets
      - ./anthias/staticfiles:/data/screenly/staticfiles
    depends_on:
      - redis
    networks:
      - signage-network

  # ===========================================================================
  # Anthias Celery (Background Tasks)
  # ===========================================================================
  anthias-celery:
    build:
      context: ./anthias
      dockerfile: docker/Dockerfile.celery
    container_name: anthias-celery
    restart: unless-stopped
    environment:
      - HOME=/data
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - anthias-data:/data
      - ./anthias-assets:/data/screenly_assets
    depends_on:
      - redis
      - anthias-server
    networks:
      - signage-network

  # ===========================================================================
  # Anthias WebSocket Server
  # ===========================================================================
  anthias-websocket:
    build:
      context: ./anthias
      dockerfile: docker/Dockerfile.websocket
    container_name: anthias-websocket
    restart: unless-stopped
    environment:
      - HOME=/data
    volumes:
      - anthias-data:/data
    depends_on:
      - redis
    networks:
      - signage-network

  # ===========================================================================
  # Anthias Nginx (Reverse Proxy with CORS)
  # ===========================================================================
  anthias-nginx:
    build:
      context: ./anthias
      dockerfile: docker/Dockerfile.nginx
    container_name: anthias-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./anthias/docker/nginx/nginx.development.conf:/etc/nginx/sites-enabled/nginx.development.conf:ro
      - ./anthias-assets:/data/screenly_assets
      - ./anthias/staticfiles:/data/screenly/staticfiles
    depends_on:
      - anthias-server
      - anthias-websocket
    networks:
      - signage-network

# =============================================================================
# Networks
# =============================================================================
networks:
  signage-network:
    name: signate_signage-network
    driver: bridge

# =============================================================================
# Volumes (Persistent Data)
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  anthias-data:
    driver: local
