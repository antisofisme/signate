openapi: 3.1.0

info:
  title: Smart TV Digital Signage API
  version: 1.0.0
  description: |
    # Smart TV Digital Signage Backend API

    Comprehensive backend API for managing Smart TV digital signage devices, content distribution,
    and centralized control across multiple display devices including monitors, browsers, and WebOS TVs.

    ## Key Features

    - **Multi-Device Support**: Manage TV, monitor, and browser-based displays
    - **Content Management**: Upload and manage images and videos with metadata
    - **Playlist System**: Create dynamic playlists with scheduling capabilities
    - **Device Monitoring**: Real-time heartbeat tracking and online/offline status
    - **Tag-Based Grouping**: Organize devices using tags for bulk content assignment
    - **Remote Commands**: Send commands to devices (reload, reset, speed test)
    - **Speed Testing**: Built-in network speed testing for devices
    - **Firebird Integration**: Optional integration with Firebird database

    ## Architecture

    - **Framework**: FastAPI (Python 3.8+)
    - **Database**: PostgreSQL 15+
    - **Media Storage**: Anthias CMS (port 8000)
    - **Authentication**: JWT Bearer tokens
    - **WebSocket**: Real-time communication support

    ## Response Standards

    This API follows Quick Wins standardized response format:

    ### Success Response
    ```json
    {
      "success": true,
      "data": { ... },
      "meta": {
        "timestamp": "2025-10-27T10:30:00Z",
        "request_id": "uuid-v4"
      }
    }
    ```

    ### Error Response
    ```json
    {
      "success": false,
      "error": {
        "code": "ERROR_CODE",
        "message": "Human-readable error message",
        "details": { ... }
      },
      "meta": {
        "timestamp": "2025-10-27T10:30:00Z",
        "request_id": "uuid-v4"
      }
    }
    ```

    ## Authentication

    Most endpoints require JWT authentication using Bearer token:

    ```
    Authorization: Bearer <access_token>
    ```

    Client endpoints (for devices) do NOT require authentication:
    - `POST /api/devices/monitor/register` - Device self-registration
    - `POST /api/devices/heartbeat` - Device heartbeat
    - `GET /api/devices/check-activation/{code}` - Activation status check
    - `GET /api/client/playlist` - Fetch device playlist
    - `GET /api/devices/{id}/commands/pending` - Get pending commands

